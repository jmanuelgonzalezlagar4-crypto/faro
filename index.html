          proj3(FX + Math.sin(a1) * r0, y0, FZ + Math.cos(a1) * r0, cam, w, h),
          proj3(FX + Math.sin(a1) * r1, y1, FZ + Math.cos(a1) * r1, cam, w, h),
          proj3(FX + Math.sin(a0) * r1, y1, FZ + Math.cos(a0) * r1, cam, w, h),
        ];
        if (P.some((p) => !p)) continue;
        // Luz lunar desde la derecha-arriba
        const lit = Math.max(0, Math.sin((a0 + a1) / 2 + 0.6) * -0.5 + 0.5);
        const base = white ? mix3([88, 100, 116], [232, 238, 244], lit)
          : mix3([84, 22, 30], [206, 60, 70], lit);
        g.fillStyle = rgb3(mix3(base, skyHor, 0.18));
        g.beginPath();
        g.moveTo(P[0].x, P[0].y); g.lineTo(P[1].x, P[1].y);
        g.lineTo(P[2].x, P[2].y); g.lineTo(P[3].x, P[3].y);
        g.closePath(); g.fill();
      }
    }
    // Galería y linterna
    const topY = baseY + HT;
    const lamp = proj3(FX, topY + 1.0, FZ, cam, w, h);
    const gal = proj3(FX, topY + 0.2, FZ, cam, w, h);
    if (gal && rise > 0.2) {
      g.fillStyle = '#0c1622';
      g.beginPath(); g.ellipse(gal.x, gal.y, gal.s * 1.9, gal.s * 0.5, 0, 0, TAU); g.fill();
    }
    if (lamp && rise > 0.6) {
      // Haz volumétrico que barre y deslumbra al pasar por la cámara
      const az = (t - 5.6) * 1.5;
      const dirx = Math.sin(az), dirz = Math.cos(az);
      const toCam = Math.max(0, -dirz); // mira a cámara cuando dirz < 0
      const flare = Math.pow(toCam, 14);
      if (t < 7.8) {
        const L2 = 34;
        const e1 = proj3(FX + Math.sin(az - 0.09) * L2, topY + 0.6, FZ + Math.cos(az - 0.09) * L2, cam, w, h);
        const e2 = proj3(FX + Math.sin(az + 0.09) * L2, topY + 0.6, FZ + Math.cos(az + 0.09) * L2, cam, w, h);
        if (e1 && e2) {
          const bg2 = g.createLinearGradient(lamp.x, lamp.y, (e1.x + e2.x) / 2, (e1.y + e2.y) / 2);
          bg2.addColorStop(0, `rgba(255,236,180,${0.55 + 0.35 * flare})`);
          bg2.addColorStop(1, 'rgba(255,236,180,0)');
          g.fillStyle = bg2;
          g.beginPath();
          g.moveTo(lamp.x, lamp.y); g.lineTo(e1.x, e1.y); g.lineTo(e2.x, e2.y);
          g.closePath(); g.fill();
        }
      }
      // Linterna + destello de lente con fantasmas
      g.fillStyle = '#ffefc0';
      g.beginPath(); g.arc(lamp.x, lamp.y, Math.max(2, lamp.s * 0.5) * (1 + flare), 0, TAU); g.fill();
      if (flare > 0.02) {
        const fg = g.createRadialGradient(lamp.x, lamp.y, 0, lamp.x, lamp.y, w * 0.7);
        fg.addColorStop(0, `rgba(255,245,220,${0.75 * flare})`);
        fg.addColorStop(0.25, `rgba(255,236,180,${0.28 * flare})`);
        fg.addColorStop(1, 'rgba(255,236,180,0)');
        g.fillStyle = fg;
        g.fillRect(0, 0, w, h);
        // Fantasmas de lente en la diagonal hacia el centro
        for (const gk of [0.35, 0.62, 0.95]) {
          const gx2 = lamp.x + (w / 2 - lamp.x) * (1 + gk);
          const gy2 = lamp.y + (h / 2 - lamp.y) * (1 + gk);
          g.fillStyle = `rgba(180,220,255,${0.16 * flare})`;
          g.beginPath(); g.arc(gx2, gy2, 8 + 18 * gk, 0, TAU); g.fill();
        }
      }
    }
  }

  // Relámpagos de tormenta: rayo dentado + destello global
  if (storm && Math.random() < 0.045) {
    const bx = w * (0.15 + Math.random() * 0.7);
    g.strokeStyle = 'rgba(255,240,245,0.85)';
    g.lineWidth = 2;
    g.beginPath();
    let x2 = bx, y2 = 6;
    g.moveTo(x2, y2);
    while (y2 < hy * 0.9) {
      x2 += (Math.random() - 0.5) * 34;
      y2 += 12 + Math.random() * 26;
      g.lineTo(x2, y2);
    }
    g.stroke();
    g.fillStyle = 'rgba(240,230,255,0.12)';
    g.fillRect(0, 0, w, h);
  }

  // Grano de película + viñeta (acabado de cine)
  g.globalAlpha = 0.5;
  g.drawImage(grain(), Math.random() * -60, Math.random() * -60, w + 160, h + 160);
  g.globalAlpha = 1;
  const vg2 = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.42, w / 2, h / 2, Math.max(w, h) * 0.78);
  vg2.addColorStop(0, 'rgba(0,0,0,0)');
  vg2.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = vg2;
  g.fillRect(0, 0, w, h);

  // Barras de cine
  const bar = h * 0.1;
  g.fillStyle = '#000';
  g.fillRect(0, 0, w, bar);
  g.fillRect(0, h - bar, w, bar);

  // Guion (sobrio, con espaciado de letras si el navegador lo soporta)
  const lines = [
    { from: 0.6, to: 2.5, big: 'EL MAR NUNCA DUERME', sub: null, color: '#dfe9f2' },
    { from: 2.8, to: 4.9, big: 'ESTA NOCHE VIENE A POR TU FARO', sub: null, color: '#eaf2fa' },
    { from: 5.2, to: 7.2, big: 'SOLO TU LUZ PUEDE DETENERLO', sub: null, color: '#ffe9a8' },
    { from: 7.6, to: 9.3, big: '¿TE CREES CAPAZ?', sub: 'el mar apuesta a que no llegas a 500', color: '#ff5964' },
    { from: 9.5, to: 11.1, big: 'DEMUÉSTRALE QUIÉN MANDA', sub: 'toca para empezar', color: '#ffc45e' },
  ];
  g.textAlign = 'center';
  try { g.letterSpacing = '3px'; } catch { /* opcional */ }
  for (const ln of lines) {
    const a = fadeIO(t, ln.from, ln.to);
    if (a <= 0) continue;
    const grow = 1 + 0.04 * easeOut((t - ln.from) / (ln.to - ln.from));
    g.save();
    g.translate(w / 2, h * 0.26);
    g.scale(grow, grow);
    g.globalAlpha = a;
    g.shadowColor = ln.color; g.shadowBlur = 22;
    g.fillStyle = ln.color;
    let fs = Math.min(26, Math.round(w / 15));
    g.font = `bold ${fs}px system-ui, sans-serif`;
    const twid = g.measureText(ln.big).width;
    if (twid > w * 0.86) {
      fs = Math.max(12, Math.floor((fs * w * 0.86) / twid));
      g.font = `bold ${fs}px system-ui, sans-serif`;
    }
    g.fillText(ln.big, 0, 0);
    if (ln.sub) {
      g.shadowBlur = 0;
      try { g.letterSpacing = '1px'; } catch { /* opcional */ }
      g.fillStyle = '#eaf2fa';
      g.font = '600 13px system-ui, sans-serif';
      g.fillText(ln.sub, 0, 26);
      try { g.letterSpacing = '3px'; } catch { /* opcional */ }
    }
    g.restore();
  }
  g.globalAlpha = 1; g.shadowBlur = 0;
  try { g.letterSpacing = '0px'; } catch { /* opcional */ }

  // Saltar
  g.fillStyle = 'rgba(234,242,250,0.5)';
  g.font = '12px system-ui, sans-serif';
  g.textAlign = 'right';
  g.fillText('toca para saltar ▸', w - 14, h - bar - 12);

  // Fundido inicial y final
  if (t < 0.7) {
    g.fillStyle = `rgba(0,0,0,${1 - t / 0.7})`;
    g.fillRect(0, 0, w, h);
  } else if (t > 10.8) {
    g.fillStyle = `rgba(0,0,0,${(t - 10.8) / 0.6})`;
    g.fillRect(0, 0, w, h);
  }
}

const easeOut = (k) => 1 - Math.pow(1 - Math.min(1, Math.max(0, k)), 3);
const easeIn = (k) => Math.pow(Math.min(1, Math.max(0, k)), 3);

/** Alpha de un texto que entra en fadeIn, se sostiene y sale. */
function fadeIO(t, from, to) {
  if (t < from || t > to) return 0;
  const inA = Math.min(1, (t - from) / 0.45);
  const outA = Math.min(1, (to - t) / 0.45);
  return Math.min(inA, outA);
}

// ---------- Render ----------
function draw(L, dt) {
  const { w, h, cx, cy, R } = L;
  const g = ctx2d;

  // Intro cinemática: sustituye todo el frame mientras está activa
  if (intro.active) { drawIntro(L, dt); return; }

  // Sacudida
  let ox = 0, oy = 0;
  if (shake > 0) {
    shake = Math.max(0, shake - dt * 2.2);
    const fxMul = prefs.lowFx ? 0.25 : 1; // accesibilidad: menos sacudida
    ox = (Math.random() - 0.5) * 10 * shake * fxMul;
    oy = (Math.random() - 0.5) * 10 * shake * fxMul;
  }
  g.save();
  g.translate(ox, oy);

  // ¿Está el motor WebGL pintando agua y cielo por píxel debajo?
  const glOn = !!(GL && GL.on);
  const theme = themeNow();
  const dNow = game.state === 'playing' ? game.difficulty : 0;
  if (glOn) {
    // La GPU ya pintó cielo+agua: el lienzo 2D queda transparente encima
    g.clearRect(-30, -30, w + 60, h + 60);
  } else {
  // Cielo (según el escenario de la zona actual)
  const sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, theme.skyTop);
  sky.addColorStop(1, theme.skyBottom);
  g.fillStyle = sky;
  g.fillRect(-20, -20, w + 40, h + 40);
  }

  // El cielo se ENCIENDE con el peligro (en WebGL lo hace el shader)
  if (!glOn && dNow > 0.5) {
    const heat = Math.min(1, (dNow - 0.5) / 0.5);
    const hg = g.createLinearGradient(0, 0, 0, h);
    hg.addColorStop(0, `rgba(140,30,45,${0.22 * heat})`);
    hg.addColorStop(0.6, `rgba(90,20,35,${0.10 * heat})`);
    hg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = hg;
    g.fillRect(-20, -20, w + 40, h + 40);
  }
  const bloodMoon = dNow > 0.75;

  // Detalles del escenario
  const nowS = performance.now() / 1000;
  if (theme.aurora) {
    const ag = g.createLinearGradient(0, 0, 0, h * 0.4);
    ag.addColorStop(0, 'rgba(80,230,170,0.16)');
    ag.addColorStop(1, 'rgba(80,230,170,0)');
    g.fillStyle = ag;
    g.beginPath();
    g.moveTo(0, h * 0.05);
    for (let x = 0; x <= w; x += 24) {
      g.lineTo(x, h * (0.10 + 0.05 * Math.sin(x / 90 + nowS * 0.6)));
    }
    g.lineTo(w, h * 0.4); g.lineTo(0, h * 0.4);
    g.closePath(); g.fill();
  }
  if (theme.storm && Math.random() < 0.006) {
    g.fillStyle = 'rgba(200,210,255,0.10)';
    g.fillRect(-20, -20, w + 40, h + 40);
  }

  // La franja de cielo real (hasta el horizonte): en pantallas anchas y bajas
  // el horizonte queda muy arriba, así que estrellas/luna/nubes se ubican
  // relativas a él y no a una fracción fija de la altura, o quedarían tapadas
  // por el océano al dibujarse éste encima.
  const camNow = GC || gameCamera(L);
  const skyH = Math.max(24, camNow.horizon);

  // Estrellas (titilan) — con WebGL las pinta el shader
  const now = performance.now() / 1000;
  if (!glOn) for (const s of stars) {
    const a = 0.35 + 0.3 * Math.sin(now * 1.5 + s.tw);
    g.globalAlpha = a;
    g.fillStyle = PAL.foam;
    g.fillRect(s.x * w, s.y * skyH * 0.95, s.s, s.s);
  }
  g.globalAlpha = 1;

  // Luna (llena si está comprada; DE SANGRE cuando la dificultad aprieta)
  // Grande y de alto contraste, como en una noche de luna llena real: la
  // versión gratuita ya es una luna llena creíble; "LUNA LLENA" de la tienda
  // la hace todavía más enorme y con halo más rico.
  const moonColor = bloodMoon ? '#f4c2ac' : '#fffaee';
  const moonGlow = bloodMoon ? '230,130,105' : '255,247,222';
  const mx = w * 0.8, my = Math.min(h * 0.2, skyH * 0.48);
  if (!prefs.fxOn.lunallena && glOn) {
    // la luna base (grande y con nubes) ya la pinta el shader
  } else if (prefs.fxOn.lunallena) {
    // LUNA LLENA (comprada): enorme, con halo en dos capas y cráteres suaves
    const mg = g.createRadialGradient(mx, my, 16, mx, my, 160);
    mg.addColorStop(0, `rgba(${moonGlow},${bloodMoon ? 0.55 : 0.46})`);
    mg.addColorStop(0.4, `rgba(${moonGlow},${bloodMoon ? 0.26 : 0.2})`);
    mg.addColorStop(1, `rgba(${moonGlow},0)`);
    g.fillStyle = mg;
    g.beginPath(); g.arc(mx, my, 160, 0, TAU); g.fill();
    g.fillStyle = bloodMoon ? '#f6c8ba' : moonColor;
    g.beginPath(); g.arc(mx, my, 64, 0, TAU); g.fill();
    g.fillStyle = bloodMoon ? 'rgba(170,90,80,0.32)' : 'rgba(168,180,168,0.26)';
    g.beginPath(); g.arc(mx - 17, my - 13, 11, 0, TAU); g.fill();
    g.beginPath(); g.arc(mx + 20, my + 10, 8, 0, TAU); g.fill();
    g.beginPath(); g.arc(mx + 5, my + 22, 6, 0, TAU); g.fill();
    g.beginPath(); g.arc(mx - 24, my + 12, 5, 0, TAU); g.fill();
  } else {
    // Luna llena de serie: ya grande y luminosa (LUNA LLENA en la tienda
    // la agranda aún más), con cráteres suaves en vez de una mordida dura.
    const mg0 = g.createRadialGradient(mx, my, 10, mx, my, 110);
    mg0.addColorStop(0, `rgba(${moonGlow},0.38)`);
    mg0.addColorStop(0.45, `rgba(${moonGlow},0.16)`);
    mg0.addColorStop(1, `rgba(${moonGlow},0)`);
    g.fillStyle = mg0;
    g.beginPath(); g.arc(mx, my, 110, 0, TAU); g.fill();
    g.fillStyle = moonColor;
    g.beginPath(); g.arc(mx, my, 46, 0, TAU); g.fill();
    g.fillStyle = 'rgba(172,182,170,0.24)';
    g.beginPath(); g.arc(mx - 12, my - 9, 8, 0, TAU); g.fill();
    g.beginPath(); g.arc(mx + 14, my + 7, 6, 0, TAU); g.fill();
    g.beginPath(); g.arc(mx + 3, my + 16, 4.5, 0, TAU); g.fill();
  }
  // Nubes pictóricas a la deriva (solo en el mar 2D; el shader ya las dibuja)
  if (!glOn) {
    const ct = performance.now() / 1000;
    for (const c of clouds) {
      const cx2 = (((c.x + ct * 0.006 * c.sp) % 1.15) - 0.08) * w;
      const cy2 = 6 + c.y * skyH * 0.92;
      const distM = Math.hypot(cx2 - mx, cy2 - my);
      const back = Math.max(0, 1 - distM / 230);
      const cg = g.createRadialGradient(cx2, cy2, 1, cx2, cy2, c.rx);
      const lit = mix3(hexRGB(theme.skyBottom), [255, 247, 222], back * 0.9);
      cg.addColorStop(0, rgb3(lit, c.o * (0.6 + back * 0.7)));
      cg.addColorStop(1, rgb3(lit, 0));
      g.fillStyle = cg;
      g.beginPath(); g.ellipse(cx2, cy2, c.rx, c.ry, 0, 0, TAU); g.fill();
    }
  }

  // Estrellas fugaces (compradas)
  if (prefs.fxOn.fugaces) {
    if (Math.random() < 0.008 && shootingStars.length < 3) {
      shootingStars.push({ x: Math.random() * w, y: Math.random() * h * 0.3, vx: 260 + Math.random() * 160, vy: 90 + Math.random() * 60, t: 0 });
    }
    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const s2 = shootingStars[i];
      s2.t += dt; s2.x += s2.vx * dt; s2.y += s2.vy * dt;
      if (s2.t > 1.1 || s2.x > w + 60) { shootingStars.splice(i, 1); continue; }
      const a2 = Math.max(0, 1 - s2.t);
      g.strokeStyle = `rgba(234,242,250,${0.8 * a2})`;
      g.lineWidth = 1.6;
      g.beginPath();
      g.moveTo(s2.x, s2.y);
      g.lineTo(s2.x - s2.vx * 0.09, s2.y - s2.vy * 0.09);
      g.stroke();
    }
  }

  // ESCENA COMPLETA CON HORIZONTE (el look del tráiler, sin mareos):
  // cielo arriba, océano de pantalla completa con líneas de oleaje suaves,
  // reflejo lunar y el campo de juego integrado en el mar.
  GC = gameCamera(L);
  {
    const seaRGB = hexRGB(theme.sea);
    const litRGB = mix3(seaRGB, [110, 150, 185], 0.5);
    const fogRGB = hexRGB(theme.skyBottom);
    const hor = Math.max(-20, GC.horizon);

    // Costa de la región (siluetas en dos capas sobre el horizonte)
    drawCoast(g, w, h, hor, theme);

    // Océano 2D (solo si no hay WebGL)
    if (!glOn) {
    const og = g.createLinearGradient(0, hor, 0, h);
    og.addColorStop(0, rgb3(mix3(seaRGB, fogRGB, 0.75)));
    og.addColorStop(0.22, rgb3(mix3(seaRGB, fogRGB, 0.35)));
    og.addColorStop(0.65, theme.sea);
    og.addColorStop(1, rgb3(mix3(seaRGB, [0, 0, 0], 0.35)));
    g.fillStyle = og;
    g.fillRect(-20, hor, w + 40, h - hor + 20);
    // Línea del horizonte, apenas insinuada
    g.strokeStyle = rgb3(mix3(fogRGB, [255, 255, 255], 0.12), 0.5);
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(-20, hor); g.lineTo(w + 20, hor); g.stroke();

    // Líneas de oleaje: filas del mundo proyectadas (lentas y serenas)
    const isCiber = U().id === 'ciber';
    const ROWS2 = 14;
    for (let r2 = 0; r2 < ROWS2; r2++) {
      const zf = -1.7 + Math.pow(r2 / (ROWS2 - 1), 1.7) * 8.2; // denso cerca
      const nearK = 1 - r2 / (ROWS2 - 1);
      g.strokeStyle = isCiber
        ? `rgba(125,216,168,${0.05 + 0.10 * nearK})`
        : rgb3(litRGB, 0.06 + 0.13 * nearK);
      g.lineWidth = 0.8 + 1.8 * nearK;
      g.beginPath();
      let first = true;
      for (let xi = -14; xi <= 14; xi++) {
        const wx = xi * 0.55;
        const hgt = isCiber ? 0
          : Math.sin(wx * 1.1 + zf * 1.4 + now * 0.55) * 0.035 +
            Math.sin(wx * 0.5 - now * 0.35 + zf) * 0.025;
        const p = seaXYW(wx, zf, hgt, L);
        if (p.y < hor - 2) { first = true; continue; }
        if (first) { g.moveTo(p.x, p.y); first = false; } else g.lineTo(p.x, p.y);
      }
      g.stroke();
    }
    // Rejilla longitudinal del universo ciber (suelo de circuito)
    if (isCiber) {
      g.strokeStyle = 'rgba(125,216,168,0.07)';
      g.lineWidth = 1;
      for (let xi = -6; xi <= 6; xi++) {
        const p0 = seaXYW(xi * 0.55, -1.7, 0, L);
        const p1 = seaXYW(xi * 0.55, 6.5, 0, L);
        g.beginPath(); g.moveTo(p0.x, p0.y); g.lineTo(p1.x, p1.y); g.stroke();
      }
    }

    // Reflejo de la luna: sendero de destellos que rielan bajo su posición
    if (!isCiber) {
      const mgx = w * 0.8;
      for (let i2 = 0; i2 < 11; i2++) {
        const kk2 = i2 / 10;
        const yy2 = hor + 8 + (h * 0.5 - 8) * Math.pow(kk2, 1.5);
        const ww2 = (7 + 32 * kk2) * (0.7 + 0.3 * Math.sin(now * 0.8 + i2 * 1.9));
        g.fillStyle = `rgba(255,247,222,${(0.22 - 0.16 * kk2) * (0.75 + 0.25 * Math.sin(now * 1.1 + i2 * 2.6))})`;
        g.beginPath();
        g.ellipse(mgx + Math.sin(i2 * 2.1) * 6 * kk2, yy2, ww2, 1.8 + 2.6 * kk2, 0, 0, TAU);
        g.fill();
      }
    }

    }

    // Borde del campo de juego, apenas insinuado (aquí nacen los barcos)
    g.lineWidth = 1;
    g.strokeStyle = 'rgba(191,227,242,0.10)';
    seaRing(g, 1.0, L); g.stroke();
    // Anillos de zona (sutiles)
    g.strokeStyle = 'rgba(191,227,242,0.09)';
    seaRing(g, CONFIG.score.zoneMid, L); g.stroke();
    g.strokeStyle = 'rgba(255,89,100,0.16)';
    seaRing(g, CONFIG.score.zoneClose, L); g.stroke();
  }

  // Haz de luz (color del aspecto elegido; el superfaro lo ensancha y dora)
  const skin = currentSkin();
  const superOn = game.superActive;
  const beamColor = superOn ? '255, 230, 150' : skin.beam;
  const beamA = game.state === 'ready' ? now * 0.8 : game.beamAngle;
  const holding = game.holding;
  const half = (game.state === 'ready' ? CONFIG.beam.halfWidth : game.beamHalfWidth) * (holding && !superOn ? 0.92 : 1);
  const glow = (holding ? 0.4 : 0.22) + (superOn ? 0.2 : 0);
  {
    // Sector del haz proyectado sobre el agua (luz que cae en el mar)
    const c0 = seaXY(0, 0, 0, L);
    const pm = seaXY(beamA, 1, 0, L);
    const grad = g.createRadialGradient(c0.x, c0.y, 4, c0.x, c0.y, Math.hypot(pm.x - c0.x, pm.y - c0.y));
    grad.addColorStop(0, `rgba(${beamColor}, ${glow + 0.25})`);
    grad.addColorStop(1, `rgba(${beamColor}, 0)`);
    g.fillStyle = grad;
    g.beginPath();
    g.moveTo(c0.x, c0.y);
    for (let i2 = 0; i2 <= 10; i2++) {
      const aa = beamA - half + (2 * half * i2) / 10;
      const pp = seaXY(aa, 1, 0, L);
      g.lineTo(pp.x, pp.y);
    }
    g.closePath(); g.fill();
    // Línea central del haz
    const l0 = seaXY(beamA, 0.12, 0, L);
    g.strokeStyle = `rgba(${beamColor}, ${holding ? 0.6 : 0.3})`;
    g.lineWidth = superOn ? 3 : 2;
    g.beginPath(); g.moveTo(l0.x, l0.y); g.lineTo(pm.x, pm.y); g.stroke();
  }

  // Isla: montículo de roca con volumen (luz de luna desde la derecha)
  {
    const ci = seaXY(0, 0, 0, L);
    g.fillStyle = '#060c14';
    seaRing(g, CONFIG.island.radius, L, 28); g.fill();
    const ig = g.createRadialGradient(ci.x + 6, ci.y - 6, 2, ci.x, ci.y, GC.sMid * CONFIG.island.radius * 1.1);
    ig.addColorStop(0, '#4a5f6e');
    ig.addColorStop(0.55, PAL.rock);
    ig.addColorStop(1, '#0a1119');
    g.fillStyle = ig;
    seaRing(g, CONFIG.island.radius * 0.8, L, 28); g.fill();
  }
  // Espuma blanca de las olas rompiendo contra las rocas del faro
  {
    const nowF = performance.now() / 1000;
    const FOAM_N = 11;
    for (let i = 0; i < FOAM_N; i++) {
      const a = (i / FOAM_N) * TAU + 0.31;
      const surge = 0.5 + 0.5 * Math.sin(nowF * 1.3 + i * 1.7);
      const r0 = CONFIG.island.radius * (0.98 + 0.045 * surge);
      const fp = seaXY(a, r0, 0, L);
      const fs = (5 + 8 * surge) * Math.max(0.5, fp.k);
      g.globalAlpha = 0.30 + 0.32 * surge;
      g.fillStyle = '#eaf6ff';
      g.beginPath(); g.ellipse(fp.x, fp.y - fs * 0.3, fs * 1.3, fs * 0.55, 0, 0, TAU); g.fill();
      g.globalAlpha = (0.16 + 0.16 * surge);
      g.beginPath(); g.ellipse(fp.x, fp.y + fs * 0.25, fs * 1.9, fs * 0.42, 0, 0, TAU); g.fill();
    }
    g.globalAlpha = 1;
  }
  const center0 = seaXY(0, 0, 0, L);
  const lh = GC.sMid * 0.115; // alto del personaje, escalado por la cámara
  const squash = holding ? 0.96 : 1;
  g.save();
  g.translate(center0.x, center0.y);
  g.scale(1, squash);
  if (U().id === 'ciber') {
    // ROBI, el ciberguardián: cuerpo, ojos que siguen el escáner y expresiones
    const tNow = performance.now() / 1000;
    const danger = game.state === 'playing' && game.ships.some((s2) => s2.dist < CONFIG.score.zoneClose && s2.dist > CONFIG.island.radius);
    const happy = game.state === 'playing' && game.time - game.lastSaveAt < 0.8;
    const bw2 = lh * 1.15, bh2 = lh * 1.5;
    // Cuerpo
    g.fillStyle = '#dfe7ef';
    roundedRect(g, -bw2 / 2, -bh2 * 0.62, bw2, bh2, lh * 0.35); g.fill();
    g.fillStyle = skin.stripes[1];
    roundedRect(g, -bw2 / 2, bh2 * 0.12, bw2, bh2 * 0.26, lh * 0.2); g.fill();
    // Antena con luz
    g.strokeStyle = '#9fb0c0'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, -bh2 * 0.62); g.lineTo(0, -bh2 * 0.62 - lh * 0.5); g.stroke();
    g.fillStyle = skin.lamp;
    g.beginPath(); g.arc(0, -bh2 * 0.62 - lh * 0.55, lh * 0.22 * (superOn ? 1.7 : 1 + 0.15 * Math.sin(tNow * 5)), 0, TAU); g.fill();
    // Ojos que miran hacia el haz (parpadeo cada ~3,7 s)
    const blink = (tNow % 3.7) < 0.12;
    const lookX = Math.cos(beamA) * lh * 0.12;
    const lookY = Math.sin(beamA) * lh * 0.12;
    for (const sx of [-1, 1]) {
      g.fillStyle = '#141d29';
      const eyeR = lh * (danger ? 0.30 : 0.24);
      if (blink) {
        g.fillRect(sx * bw2 * 0.22 - eyeR, -bh2 * 0.22 - 1, eyeR * 2, 2.5);
      } else {
        g.beginPath(); g.arc(sx * bw2 * 0.22, -bh2 * 0.22, eyeR, 0, TAU); g.fill();
        g.fillStyle = superOn ? '#ffe9a8' : '#7db8ff';
        g.beginPath(); g.arc(sx * bw2 * 0.22 + lookX, -bh2 * 0.22 + lookY, eyeR * 0.45, 0, TAU); g.fill();
      }
    }
    // Boca: sonrisa / susto / celebración
    g.strokeStyle = '#141d29'; g.lineWidth = 2; g.lineCap = 'round';
    g.beginPath();
    if (danger && !happy) {
      g.arc(0, bh2 * 0.06, lh * 0.16, 0, TAU); // "¡oh no!"
    } else if (happy) {
      g.arc(0, -bh2 * 0.03, lh * 0.26, 0.25, Math.PI - 0.25); // sonrisota
    } else {
      g.arc(0, -bh2 * 0.05, lh * 0.2, 0.5, Math.PI - 0.5);
    }
    g.stroke();
    g.lineCap = 'butt';
    // Gotita de sudor cuando hay peligro
    if (danger && !happy) {
      g.fillStyle = '#7db8ff';
      g.beginPath(); g.arc(bw2 * 0.55, -bh2 * 0.45 + Math.sin(tNow * 9) * 1.5, 2.4, 0, TAU); g.fill();
    }
  } else {
    // FARO 3D en miniatura (mismo render que el tráiler): cilindro troncocónico
    // sombreado por tiras verticales, galería, techo y linterna
    const HT = lh * 2.5;
    const rBase = lh * 0.62, rTop = lh * 0.42;
    const BANDS = 5;
    const litA = hexRGB(skin.stripes[0]);
    const litB = hexRGB(skin.stripes[1]);
    // Sombra en el agua bajo la torre
    g.fillStyle = 'rgba(0,0,0,0.30)';
    g.beginPath(); g.ellipse(lh * 0.3, lh * 0.55, rBase * 1.5, rBase * 0.5, 0, 0, TAU); g.fill();
    // Cilindro con sombreado SUAVE: cada franja es un trapecio con gradiente
    // horizontal (sombra-luz-sombra), sin tiras visibles
    for (let bnd = 0; bnd < BANDS; bnd++) {
      const y0 = lh * 0.5 - ((bnd + 1) * HT) / BANDS;
      const y1b = y0 + HT / BANDS + 0.6;
      const r0b = rBase + (rTop - rBase) * ((bnd + 1) / BANDS);
      const r1b = rBase + (rTop - rBase) * (bnd / BANDS);
      const base = bnd % 2 ? litB : litA;
      const dark = [base[0] * 0.3, base[1] * 0.3, base[2] * 0.36];
      const grd = g.createLinearGradient(-r1b, 0, r1b, 0);
      grd.addColorStop(0, rgb3(mix3(dark, base, 0.25)));
      grd.addColorStop(0.32, rgb3(base));
      grd.addColorStop(0.55, rgb3(mix3(base, [255, 255, 255], 0.18)));
      grd.addColorStop(1, rgb3(mix3(dark, base, 0.12)));
      g.fillStyle = grd;
      g.beginPath();
      g.moveTo(-r0b, y0); g.lineTo(r0b, y0);
      g.lineTo(r1b, y1b); g.lineTo(-r1b, y1b);
      g.closePath(); g.fill();
    }
    // Galería, techo y linterna
    const topY = lh * 0.5 - HT;
    g.fillStyle = '#0c1622';
    g.beginPath(); g.ellipse(0, topY, rTop * 1.35, rTop * 0.45, 0, 0, TAU); g.fill();
    g.beginPath();
    g.moveTo(-rTop * 0.9, topY - 1); g.lineTo(rTop * 0.9, topY - 1); g.lineTo(0, topY - lh * 0.55);
    g.closePath(); g.fill();
    g.fillStyle = skin.lamp;
    const lampR2 = lh * 0.3 * (superOn ? 1.6 : 1 + 0.08 * Math.sin(now * 4));
    const lg2 = g.createRadialGradient(0, topY - lh * 0.18, 1, 0, topY - lh * 0.18, lampR2 * 3);
    lg2.addColorStop(0, `rgba(${skin.beam},0.55)`);
    lg2.addColorStop(1, `rgba(${skin.beam},0)`);
    g.fillStyle = lg2;
    g.beginPath(); g.arc(0, topY - lh * 0.18, lampR2 * 3, 0, TAU); g.fill();
    g.fillStyle = skin.lamp;
    g.beginPath(); g.arc(0, topY - lh * 0.18, lampR2, 0, TAU); g.fill();
  }
  g.restore();

  // Objetos flotantes
  for (const it of game.items) {
    const p = shipXY(it, { cx, cy, R });
    const blink = it.expiresIn < 2.5 && Math.floor(it.expiresIn * 4) % 2 === 0;
    if (blink) continue;
    g.fillStyle = 'rgba(14,31,51,0.9)';
    g.beginPath(); g.arc(p.x, p.y, 13, 0, TAU); g.fill();
    g.strokeStyle = it.type === 'ancla' ? '#7db8ff' : it.type === 'bengala' ? PAL.danger : '#ffe36b';
    g.lineWidth = 2;
    g.beginPath(); g.arc(p.x, p.y, 13, 0, TAU); g.stroke();
    g.fillStyle = PAL.text;
    g.font = '13px system-ui, sans-serif';
    g.textAlign = 'center';
    g.fillText(U().itemIcons[it.type] || '⚡', p.x, p.y + 5);
    if (it.charge > 0) {
      g.strokeStyle = PAL.beamCore;
      g.lineWidth = 3;
      g.beginPath();
      g.arc(p.x, p.y, 18, -Math.PI / 2, -Math.PI / 2 + (it.charge / CONFIG.items.dwell) * TAU);
      g.stroke();
    }
  }

  // Aviso azulado mientras dura el ancla
  if (game.time < game.anchorUntil && game.state === 'playing') {
    g.strokeStyle = 'rgba(125,184,255,0.35)';
    g.lineWidth = 3;
    seaRing(g, 1.02, L); g.stroke();
  }

  // Barcos salvados (se alejan y desvanecen)
  for (let i = savedShips.length - 1; i >= 0; i--) {
    const s = savedShips[i];
    s.t += dt;
    s.dist += dt * 0.35;
    if (s.t > 1.2 || s.dist > 1.15) { savedShips.splice(i, 1); continue; }
    drawShip(g, s, L, Math.max(0, 1 - s.t / 1.2), true);
  }

  // Piratas hundiéndose: el casco escora, se sumerge y deja burbujas
  for (let i = sinkers.length - 1; i >= 0; i--) {
    const s = sinkers[i];
    s.t += dt;
    if (s.t > 1.6) { sinkers.splice(i, 1); continue; }
    const p = shipXY(s, L);
    const k = s.t / 1.6;
    const size = 15 * Math.max(0.55, Math.min(1.8, p.k));
    g.save();
    g.translate(p.x, p.y + k * size * 0.9);
    g.rotate(0.9 * k); // escora
    g.globalAlpha = 1 - k;
    // Solo asoma la parte aún no sumergida
    g.beginPath(); g.rect(-size * 1.4, -size * 1.6, size * 2.8, size * 1.6 * (1 - k * 0.9) + 2); g.clip();
    g.fillStyle = '#3c3244';
    g.beginPath();
    g.moveTo(size, 0); g.lineTo(-size * 0.7, size * 0.55); g.lineTo(-size * 0.7, -size * 0.55);
    g.closePath(); g.fill();
    g.fillStyle = '#14101c';
    g.beginPath();
    g.moveTo(size * 0.1, 0); g.lineTo(-size * 0.35, -size * 0.9); g.lineTo(-size * 0.35, 0);
    g.closePath(); g.fill();
    g.restore();
    g.globalAlpha = 1;
    // Espuma y burbujas
    g.fillStyle = `rgba(210,230,245,${0.6 * (1 - k)})`;
    for (let b2 = 0; b2 < 4; b2++) {
      const bx2 = p.x + Math.sin(b2 * 2.4 + s.t * 7) * size * 0.9;
      g.beginPath(); g.arc(bx2, p.y + 2 - (s.t * 14 + b2 * 5) % 16, 1.6 + (b2 % 2), 0, TAU); g.fill();
    }
    g.strokeStyle = `rgba(210,230,245,${0.4 * (1 - k)})`;
    g.lineWidth = 1.5;
    g.beginPath(); g.ellipse(p.x, p.y + 3, size * (0.8 + k), size * (0.28 + k * 0.35), 0, 0, TAU); g.stroke();
  }

  // Remolcador aliado en el agua mientras dura la sorpresa
  if (game.state === 'playing' && game.time < game.tugUntil) {
    const tugShip = { angle: now * 0.85, dist: 0.5, type: 'tug', id: 4242, speed: 0.05 };
    drawShip(g, tugShip, L, 0.95, false);
  }

  // Barcos activos (con estela de espuma tras ellos)
  for (const s of game.ships) {
    if (s.dist > 1.04) continue;
    const p = shipXY(s, L);
    const wake = Math.min(0.09, s.speed * 0.55);
    const pw = seaXY(s.angle, Math.min(1.06, s.dist + wake), 0, L);
    const bx = pw.x, by = pw.y;
    const wg = g.createLinearGradient(p.x, p.y, bx, by);
    wg.addColorStop(0, 'rgba(191,227,242,0.30)');
    wg.addColorStop(1, 'rgba(191,227,242,0)');
    g.strokeStyle = wg;
    g.lineWidth = 3.5;
    g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(bx, by); g.stroke();
    drawShip(g, s, L, 1, false);
  }

  // Ondas expansivas al rescatar
  for (let i = rings.length - 1; i >= 0; i--) {
    const r0 = rings[i];
    r0.t += dt;
    if (r0.t > 0.6) { rings.splice(i, 1); continue; }
    const k = r0.t / 0.6;
    g.globalAlpha = (1 - k) * 0.6;
    g.strokeStyle = r0.color;
    g.lineWidth = 2.5 * (1 - k) + 0.5;
    g.beginPath(); g.arc(r0.x, r0.y, 8 + k * 46, 0, TAU); g.stroke();
  }
  g.globalAlpha = 1;

  // Barco culpable resaltado
  if (culpritGhost) {
    culpritGhost.t += dt;
    if (culpritGhost.t < 1.4) {
      const p = shipXY(culpritGhost, L);
      const pulse = 0.5 + 0.5 * Math.sin(culpritGhost.t * 18);
      g.strokeStyle = `rgba(255,89,100,${0.4 + 0.5 * pulse})`;
      g.lineWidth = 3;
      g.beginPath(); g.arc(p.x, p.y, 16 + 5 * pulse, 0, TAU); g.stroke();
    }
  }

  // Partículas
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    if (p.t > p.life) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.96; p.vy *= 0.96;
    g.globalAlpha = 1 - p.t / p.life;
    g.fillStyle = p.color;
    g.fillRect(p.x, p.y, p.size, p.size);
  }
  g.globalAlpha = 1;

  // Popups de puntos
  g.textAlign = 'center';
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.t += dt;
    if (p.t > 1.1) { popups.splice(i, 1); continue; }
    const a = Math.max(0, 1 - p.t / 1.1);
    g.globalAlpha = a;
    g.fillStyle = p.color;
    g.font = `${p.big ? 'bold 30px' : 'bold 20px'} system-ui, sans-serif`;
    g.fillText(p.text, p.x, p.y - 14 - p.t * 30);
    if (p.sub) {
      g.font = 'bold 13px system-ui, sans-serif';
      g.fillText(p.sub, p.x, p.y + 4 - p.t * 30);
    }
  }
  g.globalAlpha = 1;

  // Mensaje de ola
  if (waveMsg) {
    waveMsg.t += dt;
    if (waveMsg.t > 2) waveMsg = null;
    else {
      g.globalAlpha = Math.min(1, 2 - waveMsg.t);
      g.fillStyle = PAL.foam;
      g.font = 'bold 16px system-ui, sans-serif';
      g.fillText(`FASE ${waveMsg.n} SUPERADA`, cx, cy - R - 14);
      g.globalAlpha = 1;
    }
  }

  // Tensión: viñeta roja + latido cuando un barco roza las rocas
  if (game.state === 'playing') {
    const danger = game.ships.some((s) => s.dist < CONFIG.score.zoneClose * 0.8 && s.dist > CONFIG.island.radius);
    if (danger) {
      const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 180);
      const vg = g.createRadialGradient(cx, cy, R * 0.7, cx, cy, Math.max(w, h) * 0.75);
      vg.addColorStop(0, 'rgba(255,89,100,0)');
      vg.addColorStop(1, `rgba(255,89,100,${0.10 + 0.08 * pulse})`);
      g.fillStyle = vg;
      g.fillRect(-20, -20, w + 40, h + 40);
      if (performance.now() - lastHeartAt > 780) {
        lastHeartAt = performance.now();
        sound.heart();
      }
    }
  }

  // Banner de cambio de zona
  if (zoneBanner) {
    zoneBanner.t += dt;
    if (zoneBanner.t > 2.6) zoneBanner = null;
    else {
      const a = Math.min(1, zoneBanner.t * 3) * Math.min(1, (2.6 - zoneBanner.t));
      g.globalAlpha = a;
      g.textAlign = 'center';
      g.fillStyle = PAL.beamCore;
      g.font = 'bold 22px system-ui, sans-serif';
      g.fillText(zoneBanner.text, cx, cy - R - 40);
      g.globalAlpha = 1;
    }
  }

  // 🌫️ Niebla cerrada (sorpresa): jirones a la deriva sobre el mar
  if (game.state === 'playing' && game.time < game.fogUntil) {
    const left2 = game.fogUntil - game.time;
    const fa = Math.min(1, Math.min(left2, 1.2) / 1.2) * 0.55;
    for (let i = 0; i < 5; i++) {
      const fx2 = cx + Math.sin(now * 0.22 + i * 2.2) * R * 0.9;
      const fy2 = cy + Math.cos(now * 0.16 + i * 1.7) * R * 0.45;
      const fr2 = R * (0.45 + (i % 3) * 0.18);
      const fgd = g.createRadialGradient(fx2, fy2, 4, fx2, fy2, fr2);
      fgd.addColorStop(0, `rgba(205,218,232,${0.16 * fa})`);
      fgd.addColorStop(1, 'rgba(205,218,232,0)');
      g.fillStyle = fgd;
      g.beginPath(); g.arc(fx2, fy2, fr2, 0, TAU); g.fill();
    }
    g.fillStyle = `rgba(205,218,232,${0.10 * fa})`;
    g.fillRect(-20, -20, w + 40, h + 40);
  }

  // Viñeta ligera y estática (sin grano en partida: menos ruido, menos mareo)
  const cvg = g.createRadialGradient(cx, cy, Math.min(w, h) * 0.52, cx, cy, Math.max(w, h) * 0.85);
  cvg.addColorStop(0, 'rgba(0,0,0,0)');
  cvg.addColorStop(1, 'rgba(0,0,0,0.28)');
  g.fillStyle = cvg;
  g.fillRect(-20, -20, w + 40, h + 40);

  // Tarjeta de viaje entre países (postal breve; la partida sigue debajo)
  if (travelCard) {
    travelCard.t += dt;
    if (travelCard.t > 3.6) travelCard = null;
    else {
      const tc = travelCard;
      const a = Math.min(1, tc.t * 3) * Math.min(1, (3.6 - tc.t) / 0.6);
      const cw2 = Math.min(w * 0.9, 340), ch2 = 96;
      const cx2 = cx, cy2 = cy - R * 0.98 - 40;
      g.globalAlpha = a * 0.92;
      g.fillStyle = 'rgba(7,15,29,0.85)';
      roundedRect(g, cx2 - cw2 / 2, cy2, cw2, ch2, 14); g.fill();
      g.strokeStyle = 'rgba(255,196,107,0.4)'; g.lineWidth = 1;
      roundedRect(g, cx2 - cw2 / 2, cy2, cw2, ch2, 14); g.stroke();
      g.globalAlpha = a;
      g.textAlign = 'center';
      g.fillStyle = PAL.dim;
      g.font = '11px system-ui, sans-serif';
      g.fillText(`ZONA ${tc.n} · ZARPAMOS RUMBO A`, cx2, cy2 + 20);
      g.fillStyle = PAL.amber;
      g.font = 'bold 19px system-ui, sans-serif';
      g.fillText(tc.to.name, cx2, cy2 + 42);
      g.fillStyle = PAL.text;
      g.font = 'bold 12px system-ui, sans-serif';
      g.fillText(tc.to.country, cx2, cy2 + 58);
      // Ruta punteada con el barquito navegando
      const rx0 = cx2 - cw2 / 2 + 26, rx1 = cx2 + cw2 / 2 - 26, ry = cy2 + 76;
      g.strokeStyle = 'rgba(191,227,242,0.5)';
      g.lineWidth = 1.5;
      g.setLineDash([4, 6]);
      g.beginPath(); g.moveTo(rx0, ry); g.lineTo(rx1, ry); g.stroke();
      g.setLineDash([]);
      const bxp = rx0 + (rx1 - rx0) * Math.min(1, tc.t / 3);
      g.fillStyle = PAL.amber;
      g.beginPath();
      g.moveTo(bxp + 6, ry); g.lineTo(bxp - 4, ry - 4); g.lineTo(bxp - 4, ry + 4);
      g.closePath(); g.fill();
      g.globalAlpha = 1;
    }
  }

  // Anuncio a pantalla: la marea de regalos / "el engaño" revelado
  if (bigBanner) {
    bigBanner.t += dt;
    if (bigBanner.t > 3.4) bigBanner = null;
    else {
      const a = Math.min(1, bigBanner.t * 3) * Math.min(1, (3.4 - bigBanner.t) / 0.6);
      g.globalAlpha = a * 0.85;
      g.fillStyle = 'rgba(7,15,29,0.75)';
      roundedRect(g, cx - Math.min(w * 0.46, 260), cy - R * 0.98 - 30, Math.min(w * 0.92, 520), 62, 12); g.fill();
      g.globalAlpha = a;
      g.textAlign = 'center';
      g.fillStyle = bigBanner.color;
      g.font = 'bold 19px system-ui, sans-serif';
      g.fillText(bigBanner.lines[0], cx, cy - R * 0.98 - 6);
      g.fillStyle = PAL.text;
      g.font = '13px system-ui, sans-serif';
      g.fillText(bigBanner.lines[1], cx, cy - R * 0.98 + 16);
      g.globalAlpha = 1;
    }
  }

  // DUELO: banda del almirante, cuenta atrás y recarga
  if (game.state === 'playing' && game.duel) {
    // Banda exterior punteada: aquí toca el almirante
    g.strokeStyle = game.duelCd > 0 ? 'rgba(255,89,100,0.25)' : 'rgba(255,193,94,0.45)';
    g.lineWidth = 3;
    g.setLineDash([10, 12]);
    seaRing(g, 1.1, L); g.stroke();
    g.setLineDash([]);
    // Cuenta atrás del farero
    const left = Math.max(0, CONFIG.duel.time - game.time);
    g.textAlign = 'center';
    g.fillStyle = left < 15 ? PAL.danger : PAL.foam;
    g.font = 'bold 15px system-ui, sans-serif';
    g.fillText(`💡 AGUANTA ${Math.ceil(left)} s`, cx, 74 + SAFE.top);
    g.fillStyle = PAL.dim;
    g.font = '11px system-ui, sans-serif';
    g.fillText(game.duelCd > 0 ? `⚓ recargando… ${game.duelCd.toFixed(1)} s` : '⚓ almirante: toca el borde y lanza', cx, 92 + SAFE.top);
  }

  // Botones del inventario (herramientas guardadas, a mano con un toque)
  invHits.length = 0;
  if (game.state === 'playing' && game.cfg.inventory && !game.duel) {
    const slots = game.cfg.inventory.max;
    const bs = 52, gap = 14;
    const total = slots * bs + (slots - 1) * gap;
    const x0 = cx - total / 2;
    const by = h - bs / 2 - 14 - SAFE.bottom;
    g.textAlign = 'center';
    for (let i = 0; i < slots; i++) {
      const bx2 = x0 + i * (bs + gap) + bs / 2;
      const tool = game.inventory[i];
      g.fillStyle = tool ? 'rgba(20,42,66,0.92)' : 'rgba(255,255,255,0.05)';
      g.beginPath(); g.arc(bx2, by, bs / 2, 0, TAU); g.fill();
      g.lineWidth = 2;
      g.strokeStyle = tool ? (tool === 'ancla' ? '#7db8ff' : PAL.danger) : 'rgba(255,255,255,0.10)';
      g.beginPath(); g.arc(bx2, by, bs / 2, 0, TAU); g.stroke();
      if (tool) {
        g.fillStyle = PAL.text;
        g.font = '22px system-ui, sans-serif';
        g.fillText(U().itemIcons[tool] || '✦', bx2, by + 8);
        const idx = i;
        invHits.push({ x: bx2 - bs / 2 - 6, y: by - bs / 2 - 6, w: bs + 12, h: bs + 12, fn: () => game.useTool(idx) });
      }
    }
  }

  // GRADADO DE COLOR + VIÑETA: unifica el look pictórico nocturno también
  // cuando no hay WebGL (el shader ya aplica el suyo propio por píxel)
  if (!glOn) {
    // Tono partido (teal en sombras / cálido en luces) + más saturación,
    // buscando el mismo aire "cine nocturno" que el shader de WebGL.
    g.globalCompositeOperation = 'overlay';
    g.fillStyle = 'rgba(20,150,175,0.30)';
    g.fillRect(-20, -20, w + 40, h + 40);
    g.globalCompositeOperation = 'soft-light';
    const wg = g.createLinearGradient(0, 0, 0, h);
    wg.addColorStop(0, 'rgba(110,150,200,0.30)');
    wg.addColorStop(0.55, 'rgba(0,0,0,0)');
    wg.addColorStop(1, 'rgba(255,180,110,0.22)');
    g.fillStyle = wg;
    g.fillRect(-20, -20, w + 40, h + 40);
    g.globalCompositeOperation = 'source-over';
    const vg = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.22, w / 2, h / 2, Math.max(w, h) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(1,5,12,0.5)');
    g.fillStyle = vg;
    g.fillRect(-20, -20, w + 40, h + 40);
  }

  drawHUD(g, L);

  if (game.state === 'ready') drawReady(g, L, now);
  if (game.state === 'over') drawOver(g, L);

  // Flash de derrota
  if (flash > 0) {
    flash = Math.max(0, flash - dt * 3);
    g.fillStyle = `rgba(255,89,100,${flash * 0.25})`;
    g.fillRect(-20, -20, w + 40, h + 40);
  }

  // Aviso de error atrapado (diagnóstico; desaparece a los 12 s)
  if (lastError && performance.now() - lastError.t < 12000) {
    g.textAlign = 'left';
    g.fillStyle = PAL.danger;
    g.font = '11px monospace';
    g.fillText(('⚠ ' + lastError.text).slice(0, 90), 8, h - 8);
  }

  if (DEBUG) drawDebug(g, L);
  g.restore();
}

/** Enemigo del universo ciber: virus con pinchos, núcleo y ojos con intención. */
function drawVirusBody(g, s, size, lit, saved) {
  const t = performance.now() / 1000;
  const wob = 1 + 0.07 * Math.sin(t * 6 + s.id);
  const r = size * 0.95 * wob;
  const body = s.type === 'corsair' ? (lit ? '#ffd2f4' : '#e07bd8')
    : s.type === 'guardian' ? '#ffe9a8'
    : s.type === 'cargo' ? (lit ? '#cfe0ee' : '#8fa3b5')
    : s.type === 'pirate' ? (lit ? '#8f7ba8' : '#4a3a5e')
    : s.type === 'tug' ? '#ffe9a8'
    : (lit ? '#d2ffd9' : '#7fd88a');
  const dark = s.type === 'corsair' ? '#8f3f88'
    : s.type === 'guardian' ? '#c8962b'
    : s.type === 'cargo' ? '#54636f'
    : s.type === 'pirate' ? '#1c1226'
    : s.type === 'tug' ? '#c8962b'
    : '#2f7a3c';
  // Pinchos giratorios (el guardián-anticuerpo no pincha: es redondito)
  if (s.type !== 'guardian') {
    g.fillStyle = dark;
    const n = s.type === 'cargo' ? 10 : 8;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + t * (s.type === 'corsair' ? 1.6 : 0.7);
      g.beginPath();
      g.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      g.lineTo(Math.cos(a + 0.22) * r * 0.82, Math.sin(a + 0.22) * r * 0.82);
      g.lineTo(Math.cos(a) * (r + size * 0.42), Math.sin(a) * (r + size * 0.42));
      g.closePath(); g.fill();
    }
  }
  // Cuerpo
  g.fillStyle = body;
  g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
  // Placas del blindado / halo del anticuerpo
  if (s.type === 'cargo') {
    g.strokeStyle = dark; g.lineWidth = 2;
    g.beginPath(); g.arc(0, 0, r * 0.62, 0, TAU); g.stroke();
  }
  if (s.type === 'guardian') {
    g.strokeStyle = 'rgba(255,233,168,0.5)'; g.lineWidth = 2;
    g.beginPath(); g.arc(0, 0, r + 4 + Math.sin(t * 4) * 1.5, 0, TAU); g.stroke();
  }
  // Ojos (miran hacia delante: rumbo al núcleo); el anticuerpo sonríe
  g.fillStyle = s.type === 'guardian' ? '#7a5b16' : '#10240f';
  const ey = r * 0.34, ex = r * 0.30;
  g.beginPath(); g.arc(ex, -ey, Math.max(1.6, r * 0.16), 0, TAU); g.fill();
  g.beginPath(); g.arc(ex, ey, Math.max(1.6, r * 0.16), 0, TAU); g.fill();
  if (s.type === 'guardian') {
    g.strokeStyle = '#7a5b16'; g.lineWidth = 1.6;
    g.beginPath(); g.arc(r * 0.05, 0, r * 0.42, -0.6, 0.6); g.stroke();
  } else if (!saved) {
    // Ceño amenazador
    g.strokeStyle = dark; g.lineWidth = 2;
    g.beginPath(); g.moveTo(ex + r * 0.22, -ey - r * 0.28); g.lineTo(ex - r * 0.2, -ey - r * 0.06); g.stroke();
    g.beginPath(); g.moveTo(ex + r * 0.22, ey + r * 0.28); g.lineTo(ex - r * 0.2, ey + r * 0.06); g.stroke();
  }
}

function drawShip(g, s, L, alpha, saved) {
  const p = shipXY(s, L);
  const c0 = seaXY(0, 0, 0, L);
  const toCenter = Math.atan2(c0.y - p.y, c0.x - p.x);
  const heading = saved ? toCenter + Math.PI : toCenter;
  // Tamaño según profundidad: los barcos cercanos se ven GRANDES (perspectiva)
  const depthK = Math.max(0.55, Math.min(1.8, p.k));
  const size = (s.type === 'cargo' ? 17 : s.type === 'pirate' ? 15 : 11 + (s.type === 'corsair' ? 0 : 2)) * depthK;
  const lit = game.holding && game.state === 'playing' &&
    s.dist <= CONFIG.beam.range &&
    angDist(game.beamAngle, s.angle) <= CONFIG.beam.halfWidth + 0.06;
  // Balanceo con la ola, suave, y sombra en el agua
  const bob = Math.sin(performance.now() / 1000 * 1.3 + (s.id % 7)) * 1.1;
  g.globalAlpha = alpha * 0.3;
  g.fillStyle = '#000';
  g.beginPath(); g.ellipse(p.x, p.y + 5, size * 1.25, size * 0.4, 0, 0, TAU); g.fill();
  g.globalAlpha = 1;
  g.save();
  g.translate(p.x, p.y - bob);
  g.rotate(heading);
  g.globalAlpha = alpha;
  if (U().id === 'ciber') {
    drawVirusBody(g, s, size, lit, saved);
    g.restore();
    g.globalAlpha = 1;
  } else {
  // ---- FLOTA RECONOCIBLE (proa hacia +x) --------------------------------
  // Cada tipo tiene silueta, casco con proa/popa, cubierta, puente y luces
  // de navegación reales: babor ROJO (-y), estribor VERDE (+y), tope blanco.
  const S = size;
  /** Casco genérico con proa afilada y popa recta, en dos tonos. */
  const hullPath = (lenF, lenA, beam) => {
    g.beginPath();
    g.moveTo(S * lenF, 0);                             // proa
    g.quadraticCurveTo(S * lenF * 0.45, -S * beam, -S * lenA * 0.75, -S * beam);
    g.lineTo(-S * lenA, -S * beam * 0.7);              // popa
    g.lineTo(-S * lenA, S * beam * 0.7);
    g.lineTo(-S * lenA * 0.75, S * beam);
    g.quadraticCurveTo(S * lenF * 0.45, S * beam, S * lenF, 0);
    g.closePath();
  };
  const shade = (c1, c2, beam) => {
    const hg2 = g.createLinearGradient(0, -S * beam, 0, S * beam);
    hg2.addColorStop(0, c1);
    hg2.addColorStop(0.55, c2);
    hg2.addColorStop(1, 'rgba(0,0,0,0.9)');
    return hg2;
  };
  const litUp = (c) => lit ? '#ffe9c2' : c;

  if (s.type === 'cargo') {
    // MERCANTE PORTACONTENEDORES: casco largo, contenedores, puente en popa
    hullPath(1.15, 1.0, 0.42);
    g.fillStyle = shade('#7e2f2f', '#5d2323', 0.42);
    g.fill();
    // Contenedores en dos filas de tres (colores portuarios apagados)
    const cc = ['#9a5a2e', '#41666e', '#7a7f4b', '#5d5f8e', '#8a4a55', '#4e7a52'];
    for (let ci = 0; ci < 6; ci++) {
      const col2 = ci % 3, row = ci < 3 ? -1 : 1;
      g.fillStyle = litUp(cc[ci]);
      g.fillRect(S * (0.55 - col2 * 0.52), row === -1 ? -S * 0.30 : S * 0.04, S * 0.44, S * 0.26);
    }
    // Puente blanco en popa con ventanas
    g.fillStyle = litUp('#d8e2ea');
    g.fillRect(-S * 0.95, -S * 0.26, S * 0.3, S * 0.52);
    g.fillStyle = '#25313d';
    g.fillRect(-S * 0.9, -S * 0.16, S * 0.2, S * 0.09);
  } else if (s.type === 'corsair') {
    // LANCHA RÁPIDA: esbelta, parabrisas, franja roja
    hullPath(1.35, 0.75, 0.3);
    g.fillStyle = shade('#e8eef4', '#c6d2dc', 0.3);
    g.fill();
    g.strokeStyle = '#c8323e'; g.lineWidth = Math.max(1, S * 0.08);
    g.beginPath(); g.moveTo(S * 1.1, 0); g.lineTo(-S * 0.7, 0); g.stroke();
    g.fillStyle = '#1c2733'; // parabrisas
    g.beginPath();
    g.moveTo(S * 0.45, 0); g.lineTo(S * 0.05, -S * 0.2); g.lineTo(S * 0.05, S * 0.2);
    g.closePath(); g.fill();
  } else if (s.type === 'guardian') {
    // SALVAMENTO MARÍTIMO: casco naranja, cabina blanca, franja
    hullPath(1.0, 0.85, 0.44);
    g.fillStyle = shade('#e8823c', '#c9662a', 0.44);
    g.fill();
    g.fillStyle = litUp('#eef2f6'); // cabina
    g.fillRect(-S * 0.35, -S * 0.26, S * 0.62, S * 0.52);
    g.fillStyle = '#1c2733';
    g.fillRect(-S * 0.24, -S * 0.15, S * 0.34, S * 0.1);
    g.strokeStyle = '#eef2f6'; g.lineWidth = Math.max(1, S * 0.07); // franja
    g.beginPath(); g.moveTo(S * 0.9, -S * 0.2); g.lineTo(S * 0.5, -S * 0.34); g.stroke();
  } else if (s.type === 'pirate') {
    // GALEÓN PIRATA: casco oscuro con popa alzada y dos velas negras
    hullPath(1.1, 1.0, 0.4);
    g.fillStyle = shade('#4a3a30', '#33261e', 0.4);
    g.fill();
    g.fillStyle = '#241a14'; // castillo de popa alzado
    g.fillRect(-S * 1.0, -S * 0.34, S * 0.34, S * 0.68);
    g.fillStyle = '#100d16'; // velas cuadras negras
    g.fillRect(S * 0.28, -S * 0.66, S * 0.14, S * 1.32);
    g.fillRect(-S * 0.38, -S * 0.8, S * 0.14, S * 1.6);
    g.strokeStyle = 'rgba(255,96,84,0.65)'; g.lineWidth = 1.2;
    hullPath(1.1, 1.0, 0.4); g.stroke();
  } else if (s.type === 'tug') {
    // REMOLCADOR: corto y robusto, chimenea, defensas
    hullPath(0.85, 0.8, 0.5);
    g.fillStyle = shade('#3a4552', '#252d38', 0.5);
    g.fill();
    g.fillStyle = litUp('#ffcf6b'); // superestructura dorada
    g.fillRect(-S * 0.45, -S * 0.3, S * 0.7, S * 0.6);
    g.fillStyle = '#c8323e'; // chimenea
    g.beginPath(); g.arc(-S * 0.1, 0, S * 0.16, 0, TAU); g.fill();
    g.strokeStyle = '#141d29'; g.lineWidth = Math.max(1, S * 0.1); // defensas
    hullPath(0.85, 0.8, 0.5); g.stroke();
  } else {
    // PESQUERO: casco azul con borda clara, cabina a popa, mástil con luz
    hullPath(1.0, 0.8, 0.42);
    g.fillStyle = shade('#4a6a86', '#35506a', 0.42);
    g.fill();
    g.strokeStyle = litUp('#c9d6e2'); g.lineWidth = Math.max(1, S * 0.06); // borda
    hullPath(0.96, 0.77, 0.38); g.stroke();
    g.fillStyle = litUp('#e3d9c2'); // cabina de madera
    g.fillRect(-S * 0.6, -S * 0.22, S * 0.42, S * 0.44);
    g.fillStyle = '#243240';
    g.fillRect(-S * 0.52, -S * 0.12, S * 0.2, S * 0.1);
    g.strokeStyle = '#8a9bb0'; g.lineWidth = 1; // mástil
    g.beginPath(); g.moveTo(S * 0.3, 0); g.lineTo(S * 0.3, -S * 0.05); g.stroke();
  }

  // Luces de navegación: babor ROJO / estribor VERDE / tope BLANCO
  const lr = Math.max(1.1, S * 0.09);
  g.fillStyle = 'rgba(255,80,80,0.9)';
  g.beginPath(); g.arc(S * 0.35, -S * 0.3, lr, 0, TAU); g.fill();
  g.fillStyle = 'rgba(90,230,120,0.9)';
  g.beginPath(); g.arc(S * 0.35, S * 0.3, lr, 0, TAU); g.fill();
  g.fillStyle = '#fff4d8';
  g.beginPath(); g.arc(-S * 0.55, 0, lr * 0.9, 0, TAU); g.fill();

  g.restore();
  g.globalAlpha = 1;
  }
  // Bandera del pirata (se ve de un vistazo que es el enemigo)
  if (s.type === 'pirate' && !saved) {
    g.globalAlpha = alpha;
    g.font = 'bold 13px system-ui, sans-serif';
    g.textAlign = 'center';
    g.fillText('🏴‍☠️', p.x, p.y - 18);
    g.globalAlpha = 1;
  }

  // Puntos de vida del carguero (cuántas luces le faltan)
  if (s.type === 'cargo' && !saved && (s.hits || 1) >= 1) {
    g.fillStyle = PAL.foam;
    g.font = 'bold 12px system-ui, sans-serif';
    g.textAlign = 'center';
    g.fillText('●'.repeat(s.hits || 1), p.x, p.y - 20);
  }

  // Marca flotante del guardián (se ve de un vistazo cuál da escudo)
  if (s.type === 'guardian' && !saved) {
    const bob = Math.sin(performance.now() / 250) * 2;
    g.globalAlpha = alpha;
    g.fillStyle = PAL.beamCore;
    g.font = 'bold 13px system-ui, sans-serif';
    g.textAlign = 'center';
    g.fillText(U().guardMark, p.x, p.y - 18 + bob);
    g.globalAlpha = 1;
  }

  // Anillo de carga
  if (s.charge > 0) {
    const frac = Math.min(1, s.charge / CONFIG.beam.dwell);
    g.strokeStyle = PAL.beamCore;
    g.lineWidth = 3;
    g.beginPath();
    g.arc(p.x, p.y, 16, -Math.PI / 2, -Math.PI / 2 + frac * TAU);
    g.stroke();
  }
  // Aviso de peligro cerca de las rocas
  if (!saved && s.dist < CONFIG.score.zoneClose && game.state === 'playing') {
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 90);
    g.strokeStyle = `rgba(255,89,100,${0.25 + 0.35 * pulse})`;
    g.lineWidth = 1.5;
    g.beginPath(); g.arc(p.x, p.y, 14, 0, TAU); g.stroke();
  }
}

function drawHUD(g, L) {
  const { w, cx } = L;
  g.textAlign = 'center';
  // Puntuación (solo cuando hay partida)
  if (game.state !== 'ready') {
    g.fillStyle = PAL.text;
    g.font = 'bold 34px system-ui, sans-serif';
    g.fillText(String(game.score), cx, 46 + SAFE.top);
  }
  // Etiqueta de desafío diario o reto
  if (game.state === 'playing' && (dailyMode || challenge)) {
    g.fillStyle = challenge ? PAL.danger : PAL.foam;
    g.font = 'bold 11px system-ui, sans-serif';
    const label = challenge ? `🎯 RETO: objetivo ${challenge.target}` : '🗓️ DESAFÍO DIARIO';
    g.fillText(label, cx, (game.chain >= 2 ? 100 : 82) + SAFE.top);
  }
  // Combo
  if (game.chain >= 2 && game.state === 'playing') {
    g.fillStyle = PAL.amber;
    g.font = 'bold 15px system-ui, sans-serif';
    const m = Math.min(CONFIG.score.comboMax, 1 + Math.floor(game.chain / CONFIG.score.comboStep));
    g.fillText(`racha ${game.chain} · ×${m}`, cx, 66);
  }
  // Escudos
  if (game.shields > 0 && game.state !== 'ready') {
    g.fillStyle = PAL.beamCore;
    g.font = '16px system-ui, sans-serif';
    g.fillText('♥'.repeat(game.shields), cx, game.chain >= 2 ? 86 : 66);
  }
  // Barra de récord
  if (records.best > 0) {
    const frac = Math.min(1, game.score / records.best);
    g.fillStyle = 'rgba(255,255,255,0.10)';
    g.fillRect(0, SAFE.top, w, 4);
    g.fillStyle = frac >= 1 ? PAL.beamCore : PAL.amber;
    g.fillRect(0, SAFE.top, w * frac, 4);
    g.textAlign = 'left';
    g.fillStyle = PAL.dim;
    g.font = '12px system-ui, sans-serif';
    g.fillText(`RÉCORD ${records.best} · HOY ${records.daily.score}`, 12, 22 + SAFE.top);
  }
  // Medidor de SUPERFARO
  if (game.state === 'playing') {
    const bw = 150, bh = 8;
    const bx = cx - bw / 2, by = layout().h - 106 - SAFE.bottom; // sobre los botones del inventario
    const frac = Math.min(1, game.power / CONFIG.power.needed);
    const full = frac >= 1 && !game.superActive;
    g.fillStyle = 'rgba(255,255,255,0.12)';
    roundedRect(g, bx, by, bw, bh, 4); g.fill();
    g.fillStyle = game.superActive ? PAL.beamCore : full ? PAL.beamCore : PAL.amber;
    if (full) g.globalAlpha = 0.7 + 0.3 * Math.sin(performance.now() / 150);
    roundedRect(g, bx, by, bw * (game.superActive ? (game.superUntil - game.time) / CONFIG.power.duration : frac), bh, 4); g.fill();
    g.globalAlpha = 1;
    g.textAlign = 'center';
    g.fillStyle = full ? PAL.beamCore : PAL.dim;
    g.font = full ? 'bold 13px system-ui, sans-serif' : '11px system-ui, sans-serif';
    g.fillText(
      game.superActive ? `¡¡${U().superName}!!` : full ? `${U().superName} LISTO — ¡doble toque!` : U().superName,
      cx, by - 6
    );
  }

  // Botón de silencio + botón de efectos reducidos (accesibilidad)
  const m = muteRect();
  g.textAlign = 'center';
  g.font = '20px system-ui, sans-serif';
  g.globalAlpha = 0.75;
  g.fillText(sound.muted ? '🔇' : '🔊', m.x + m.s / 2, m.y + m.s / 2 + 7);
  const fx = fxRect();
  g.globalAlpha = prefs.lowFx ? 0.45 : 0.75;
  g.fillText('✨', fx.x + fx.s / 2, fx.y + fx.s / 2 + 7);
  if (prefs.lowFx) {
    g.strokeStyle = PAL.dim; g.lineWidth = 2;
    g.beginPath();
    g.moveTo(fx.x + 8, fx.y + fx.s - 8); g.lineTo(fx.x + fx.s - 8, fx.y + 8);
    g.stroke();
  }
  g.globalAlpha = 1;
}

function drawReady(g, L, now) {
  const { cx, cy, R, h } = L;
  menuHits.length = 0;
  g.textAlign = 'center';

  // Panel de la TIENDA (sustituye al menú mientras está abierto)
  if (shopOpen) {
    g.fillStyle = 'rgba(7,15,29,0.82)';
    g.fillRect(0, 0, L.w, h);
    g.fillStyle = PAL.amber;
    g.font = 'bold 24px system-ui, sans-serif';
    g.fillText(`⚓ TIENDA · 🪙 ${prefs.coins}`, cx, cy - R * 0.72);
    g.fillStyle = PAL.dim;
    g.font = '12px system-ui, sans-serif';
    g.fillText('ganas 1 🪙 por cada 50 puntos · los efectos se activan y desactivan tocándolos', cx, cy - R * 0.6);
    const y0 = cy - R * 0.42;
    SHOP_ITEMS.forEach((item, i) => {
      const y = y0 + i * 44;
      const owned = !!prefs.shop[item.id];
      const on = item.fx && prefs.fxOn[item.id];
      g.fillStyle = owned ? 'rgba(255,232,176,0.08)' : 'rgba(255,255,255,0.05)';
      roundedRect(g, cx - 190, y - 24, 380, 38, 10); g.fill();
      g.textAlign = 'left';
      g.fillStyle = owned ? PAL.beamCore : PAL.text;
      g.font = 'bold 14px system-ui, sans-serif';
      g.fillText(`${item.icon} ${item.name}`, cx - 175, y - 4);
      g.fillStyle = PAL.dim;
      g.font = '11px system-ui, sans-serif';
      g.fillText(item.desc, cx - 175, y + 10);
      g.textAlign = 'right';
      g.font = 'bold 13px system-ui, sans-serif';
      if (!owned) {
        g.fillStyle = prefs.coins >= item.price ? PAL.amber : PAL.dim;
        g.fillText(`🪙 ${item.price}`, cx + 175, y + 2);
      } else {
        g.fillStyle = item.fx ? (on ? PAL.beamCore : PAL.dim) : PAL.beamCore;
        g.fillText(item.fx ? (on ? 'ACTIVADO' : 'APAGADO') : 'EQUIPADO', cx + 175, y + 2);
      }
      menuHits.push({ x: cx - 190, y: y - 24, w: 380, h: 38, fn: () => shopTap(item) });
    });
    g.textAlign = 'center';
    g.fillStyle = PAL.amber;
    g.font = 'bold 16px system-ui, sans-serif';
    const by = y0 + SHOP_ITEMS.length * 44 + 14;
    g.fillText('◀ VOLVER', cx, by);
    menuHits.push({ x: cx - 80, y: by - 20, w: 160, h: 32, fn: () => { shopOpen = false; } });
    return;
  }
  g.fillStyle = PAL.text;
  g.font = `bold ${Math.round(R * 0.28)}px Georgia, serif`;
  g.fillText('FARO', cx, cy - R * 0.62);
  g.fillStyle = PAL.dim;
  g.font = '16px system-ui, sans-serif';
  g.fillText('Mantén pulsado para detener la luz e iluminar los barcos', cx, cy - R * 0.44);
  g.fillText('No dejes que ninguno llegue a las rocas', cx, cy - R * 0.32);

  // Banner de reto activo
  if (challenge) {
    g.fillStyle = PAL.danger;
    g.font = 'bold 16px system-ui, sans-serif';
    g.fillText(`🎯 RETO: supera ${challenge.target} puntos (misma partida)`, cx, cy - R * 0.24);
  }

  // Nivel de farero y experiencia
  const lvl = levelFor(prefs.xp);
  const next = xpForLevel(lvl + 1);
  const prev = xpForLevel(lvl);
  g.fillStyle = PAL.amber;
  g.font = 'bold 15px system-ui, sans-serif';
  g.fillText(`⭐ FARERO NIVEL ${lvl}`, cx, cy - R * 0.16);
  const pbw = 140;
  g.fillStyle = 'rgba(255,255,255,0.12)';
  roundedRect(g, cx - pbw / 2, cy - R * 0.11, pbw, 5, 3); g.fill();
  g.fillStyle = PAL.amber;
  roundedRect(g, cx - pbw / 2, cy - R * 0.11, pbw * Math.min(1, (prefs.xp - prev) / Math.max(1, next - prev)), 5, 3); g.fill();

  const a = 0.55 + 0.45 * Math.sin(now * 3.5);
  g.globalAlpha = a;
  g.fillStyle = PAL.amber;
  g.font = 'bold 18px system-ui, sans-serif';
  g.fillText('toca para empezar', cx, cy + R * 0.62);
  g.globalAlpha = 1;

  // Botón de la TIENDA (monedas acumuladas)
  {
    const ty = cy + R * 0.40;
    const tw = 200;
    g.fillStyle = 'rgba(255,255,255,0.08)';
    roundedRect(g, cx - tw / 2, ty - 17, tw, 32, 16); g.fill();
    g.fillStyle = PAL.amber;
    g.font = 'bold 15px system-ui, sans-serif';
    g.fillText(`🪙 ${prefs.coins} · TIENDA`, cx, ty + 5);
    menuHits.push({ x: cx - tw / 2, y: ty - 17, w: tw, h: 32, fn: () => { shopOpen = true; } });
    // Utensilios ya comprados, a la vista
    const owned = SHOP_ITEMS.filter((it) => prefs.shop[it.id] && !it.fx).map((it) => it.icon);
    if (owned.length) {
      g.font = '13px system-ui, sans-serif';
      g.fillStyle = PAL.dim;
      g.fillText(`equipado: ${owned.join(' ')}`, cx, ty + 24);
    }
  }

  // Racha de días y logros
  if (streak.days >= 2 || Object.keys(achv).length > 0) {
    g.fillStyle = PAL.dim;
    g.font = '12px system-ui, sans-serif';
    const bits = [];
    if (streak.days >= 2) bits.push(`🔥 racha de ${streak.days} días`);
    bits.push(`🏅 ${Object.keys(achv).length}/${ACHIEVEMENTS.length} logros`);
    g.fillText(bits.join('   ·   '), cx, cy - R * 0.02);
  }

  // Selectores: modo, escenario y aspecto del faro
  const rows = [
    {
      y: Math.min(h - 118, cy + R * 0.74),
      label: `UNIVERSO: ${U().name}`,
      locked: false,
      hint: null,
      move: (dir) => {
        prefs.universe = ((prefs.universe || 0) + dir + UNIVERSES.length) % UNIVERSES.length;
        store.set('faro.universe', prefs.universe);
        sound.record();
      },
    },
    {
      y: Math.min(h - 88, cy + R * 0.88),
      label: duelMode ? 'MODO: ⚔️ DUELO (2 jugadores, 1 pantalla)'
        : dailyMode ? `MODO: 🗓️ DESAFÍO DIARIO (hoy: ${records.daily.score})` : 'MODO: NORMAL',
      locked: false,
      hint: duelMode ? 'uno ilumina · el otro toca el borde y lanza barcos' : null,
      move: (dir) => {
        // Ciclo NORMAL → DESAFÍO DIARIO → DUELO
        const modes = ['normal', 'daily', 'duel'];
        const cur = duelMode ? 2 : dailyMode ? 1 : 0;
        const nxt = modes[(cur + dir + 3) % 3];
        dailyMode = nxt === 'daily';
        duelMode = nxt === 'duel';
        store.set('faro.daily.mode', dailyMode);
        store.set('faro.duel.mode', duelMode);
        game = makeGame();
        makeStars(game.seed);
      },
    },
    {
      y: Math.min(h - 58, cy + R * 1.02),
      label: (dailyMode || duelMode) ? 'EMPEZAR: fase 1 en este modo'
        : `EMPEZAR: FASE ${effectiveStartWave() + 1} · ${themeName(zoneIndexFor(effectiveStartWave()))}`,
      locked: prefs.checkpoint === 0 || dailyMode || duelMode,
      hint: prefs.checkpoint === 0 && !dailyMode && !duelMode
        ? `supera la fase ${CONFIG.checkpoint.every} para guardar un punto de control` : null,
      move: (dir) => {
        // Puntos de control: fase 1, 4, 7… (cada 3 fases superadas)
        const stops = [0];
        for (let wCp = CONFIG.checkpoint.every; wCp <= prefs.checkpoint; wCp += CONFIG.checkpoint.every) stops.push(wCp);
        const pos = Math.max(0, stops.indexOf(Math.min(prefs.startWave, prefs.checkpoint)));
        prefs.startWave = stops[(pos + dir + stops.length) % stops.length];
        store.set('faro.startWave', prefs.startWave);
        game = makeGame();
        makeStars(game.seed);
      },
    },
    {
      y: Math.min(h - 28, cy + R * 1.16),
      label: `${U().id === 'ciber' ? 'COLOR' : 'FARO'}: ${currentSkin().name}`,
      locked: SKINS.filter((s) => s.level <= levelFor(prefs.xp)).length <= 1,
      hint: null,
      move: (dir) => {
        const unlocked = SKINS.map((s, i) => ({ s, i })).filter((x) => x.s.level <= levelFor(prefs.xp));
        const pos = unlocked.findIndex((x) => x.i === prefs.skin);
        const nxt = unlocked[(pos + dir + unlocked.length) % unlocked.length];
        prefs.skin = nxt.i;
        store.set('faro.skin', prefs.skin);
      },
    },
  ];
  g.font = 'bold 14px system-ui, sans-serif';
  for (const r of rows) {
    g.fillStyle = r.locked ? PAL.dim : PAL.text;
    g.fillText(r.label, cx, r.y);
    if (r.hint) {
      g.fillStyle = PAL.dim;
      g.font = '11px system-ui, sans-serif';
      g.fillText(r.hint, cx, r.y + 14);
      g.font = 'bold 14px system-ui, sans-serif';
    }
    if (!r.locked) {
      g.fillStyle = PAL.amber;
      g.fillText('◀', cx - 130, r.y);
      g.fillText('▶', cx + 130, r.y);
      menuHits.push({ x: cx - 155, y: r.y - 22, w: 50, h: 34, fn: () => r.move(-1) });
      menuHits.push({ x: cx + 105, y: r.y - 22, w: 50, h: 34, fn: () => r.move(1) });
    }
  }
  // Próximo aspecto bloqueado como incentivo
  const nextLocked = SKINS.find((s) => s.level > levelFor(prefs.xp));
  if (nextLocked) {
    g.fillStyle = PAL.dim;
    g.font = '11px system-ui, sans-serif';
    g.fillText(`🔒 ${nextLocked.name} en el nivel ${nextLocked.level}`, cx, Math.min(h - 10, cy + R * 1.16 + 16));
  }
}

function drawOver(g, L) {
  const { w, h, cx, cy } = L;
  g.fillStyle = 'rgba(7,15,29,0.72)';
  g.fillRect(-20, -20, w + 40, h + 40);
  g.textAlign = 'center';

  if (game.duel) {
    // Resultado del duelo: farero (aguantó) o almirante (hundió el faro)
    const farero = game.duelEnded && !game.deathCause;
    g.fillStyle = farero ? PAL.beamCore : PAL.danger;
    g.font = 'bold 26px system-ui, sans-serif';
    g.fillText(farero ? '💡 ¡GANA EL FARERO!' : '⚓ ¡GANA EL ALMIRANTE!', cx, cy - 96);
    g.fillStyle = PAL.text;
    g.font = 'bold 56px system-ui, sans-serif';
    g.fillText(String(game.score), cx, cy - 36);
    g.fillStyle = PAL.dim;
    g.font = '16px system-ui, sans-serif';
    g.fillText(farero
      ? `aguantó los ${CONFIG.duel.time} s · ${game.saves} rescates`
      : `el faro cayó a los ${Math.floor(game.time)} s · ${game.saves} rescates`, cx, cy - 6);
    g.fillText('cambiad los papeles y ajustad cuentas', cx, cy + 18);
  } else {
  const isRecord = game.score >= records.best && game.score > 0;
  g.fillStyle = isRecord ? PAL.beamCore : PAL.text;
  g.font = 'bold 26px system-ui, sans-serif';
  g.fillText(isRecord ? '¡NUEVO RÉCORD!' : U().overTitle, cx, cy - 96);

  g.fillStyle = PAL.text;
  g.font = 'bold 56px system-ui, sans-serif';
  g.fillText(String(game.score), cx, cy - 36);

  g.fillStyle = PAL.dim;
  g.font = '16px system-ui, sans-serif';
  if (!isRecord && records.best > 0) {
    const gap = records.best - game.score;
    g.fillText(`Récord: ${records.best} — te faltaron ${gap}`, cx, cy - 6);
  } else if (isRecord && prevBest > 0) {
    g.fillText(`Récord anterior: ${prevBest}`, cx, cy - 6);
  }
  g.fillText(`mejor racha ${game.bestChain} · rescates ${game.saves} · +${Math.floor(game.score / 50) + game.bonusCoins} 🪙`, cx, cy + 18);
  // Rango de la noche (S/A/B/C) — objetivo claro para "una vez más"
  {
    const rk = isRecord ? 'S' : records.best > 0 && game.score >= records.best * 0.8 ? 'A'
      : records.best > 0 && game.score >= records.best * 0.5 ? 'B' : 'C';
    const rc = rk === 'S' ? PAL.beamCore : rk === 'A' ? PAL.amber : rk === 'B' ? PAL.foam : PAL.dim;
    g.strokeStyle = rc; g.lineWidth = 3;
    g.beginPath(); g.arc(cx + 118, cy - 52, 21, 0, TAU); g.stroke();
    g.fillStyle = rc;
    g.font = 'bold 26px system-ui, sans-serif';
    g.fillText(rk, cx + 118, cy - 43);
    // Récord de la costa donde terminó la noche
    const rz = String(game.zoneIndex % THEMES.length);
    if (prefs.regionBest[rz]) {
      g.fillStyle = PAL.dim;
      g.font = '12px system-ui, sans-serif';
      g.fillText(`récord en ${THEMES[game.zoneIndex % THEMES.length].name}: ${prefs.regionBest[rz]}`, cx, cy + 38);
    }
  }
  }

  // Resultado del reto 1 contra 1
  if (challenge) {
    const win = game.score > challenge.target;
    g.fillStyle = win ? PAL.beamCore : PAL.danger;
    g.font = 'bold 17px system-ui, sans-serif';
    g.fillText(
      win ? `🏆 ¡RETO SUPERADO! (${challenge.target} → ${game.score})`
          : `🎯 Reto no superado: te faltaron ${challenge.target - game.score + 1}`,
      cx, cy - 62
    );
  }

  // Botón grande OTRA VEZ (toda la pantalla acepta la pulsación)
  const ready = performance.now() - overSince >= CONFIG.restart.lockout * 1000;
  const bw = 220, bh = 58;
  g.fillStyle = ready ? PAL.amber : 'rgba(255,196,107,0.35)';
  roundedRect(g, cx - bw / 2, cy + 44, bw, bh, 14);
  g.fill();
  g.fillStyle = '#1a1206';
  g.font = 'bold 24px system-ui, sans-serif';
  g.fillText('OTRA VEZ', cx, cy + 44 + bh / 2 + 8);

  // Botón COMPARTIR (no aplica al duelo local)
  if (game.duel) {
    shareRect = null;
  } else {
    const sw2 = 220, sh2 = 40;
    shareRect = { x: cx - sw2 / 2, y: cy + 116, w: sw2, h: sh2 };
    g.strokeStyle = PAL.amber;
    g.lineWidth = 2;
    roundedRect(g, shareRect.x, shareRect.y, sw2, sh2, 12);
    g.stroke();
    g.fillStyle = PAL.amber;
    g.font = 'bold 16px system-ui, sans-serif';
    g.fillText('RETAR A UN AMIGO 📤', cx, shareRect.y + 26);
  }

  // Misiones de hoy
  g.font = 'bold 13px system-ui, sans-serif';
  g.fillStyle = PAL.foam;
  g.fillText('— MISIONES DE HOY —', cx, cy + 186);
  g.font = '13px system-ui, sans-serif';
  missionDefs.forEach((m, i) => {
    const done = !!missions.done[m.id];
    const prog = Math.min(missions.progress[m.id] || 0, m.target);
    g.fillStyle = done ? PAL.beamCore : PAL.dim;
    g.fillText(`${done ? '✔' : '○'} ${m.text}  (${prog}/${m.target})${done ? '' : ` · +${m.xp} XP`}`, cx, cy + 208 + i * 20);
  });

  g.fillStyle = PAL.dim;
  g.font = '12px system-ui, sans-serif';
  g.fillText(`semilla ${game.seed} · partidas hoy ${session.games + 1}`, cx, h - 16);
}

/** Comparte un RETO 1 contra 1: misma partida (semilla) y tu puntuación a batir. */
function doShare() {
  const url = `https://jmanuelgonzalezlagar4-crypto.github.io/faro/?reto=${game.seed}&puntos=${lastShareScore}`;
  const txt = `⚓ Te reto en FARO 🗼 Misma partida, supera mis ${lastShareScore} puntos:`;
  if (navigator.share) {
    navigator.share({ title: 'FARO — reto', text: txt, url }).catch(() => { /* cancelado */ });
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(`${txt} ${url}`).then(() => {
      popups.push({ x: innerWidth / 2, y: innerHeight * 0.4, text: '¡Reto copiado!', sub: 'pégalo en WhatsApp', t: 0, color: PAL.foam });
    }).catch(() => { /* sin permiso */ });
  }
}

function drawDebug(g, L) {
  const gme = game;
  g.textAlign = 'left';
  g.fillStyle = '#9fe8a0';
  g.font = '12px monospace';
  const lines = [
    `fps ${debugState.fps.toFixed(0)}  ts ×${debugState.timescale.toFixed(2)}${debugState.invincible ? '  INVENCIBLE' : ''}`,
    `D ${gme.difficulty.toFixed(3)}  barcos ${gme.ships.length}  t ${gme.time.toFixed(1)}s`,
    `semilla ${gme.seed}  presses ${gme.presses}  lat.entrada ${debugState.latency.toFixed(1)}ms`,
    `[ ] velocidad · I invencible · H hitboxes`,
  ];
  lines.forEach((l, i) => g.fillText(l, 10, L.h - 64 + i * 15));
  if (debugState.hitboxes) {
    g.strokeStyle = 'rgba(159,232,160,0.5)';
    g.lineWidth = 1;
    for (const s of gme.ships) {
      const p = shipXY(s, L);
      g.beginPath(); g.arc(p.x, p.y, CONFIG.ship.radius * L.R, 0, TAU); g.stroke();
    }
    const a = gme.beamAngle, hw = CONFIG.beam.halfWidth;
    g.beginPath();
    g.moveTo(L.cx, L.cy);
    g.lineTo(L.cx + Math.cos(a - hw) * L.R, L.cy + Math.sin(a - hw) * L.R);
    g.moveTo(L.cx, L.cy);
    g.lineTo(L.cx + Math.cos(a + hw) * L.R, L.cy + Math.sin(a + hw) * L.R);
    g.stroke();
  }
}

// ---------- Bucle principal ----------
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', () => { measureSafeArea(); resize(); if (GL) GL.resize(); });
// iOS: al girar el móvil, Safari tarda un instante en asentar las medidas
addEventListener('orientationchange', () => {
  setTimeout(() => { measureSafeArea(); resize(); if (GL) GL.resize(); }, 350);
});
// iOS Safari: sin zoom por pellizco/doble toque ni menús de pulsación larga
for (const evName of ['gesturestart', 'gesturechange', 'gestureend']) {
  addEventListener(evName, (e) => e.preventDefault(), { passive: false });
}
addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
measureSafeArea();
resize();
if (GL) GL.resize();

let lastT = performance.now();
function frame(t) {
  let dt = Math.min(0.05, (t - lastT) / 1000) * debugState.timescale;
  lastT = t;

  // Cámara lenta tras un rescate al límite (solo presentación + tiempo de juego)
  if (slowmo > 0) {
    slowmo = Math.max(0, slowmo - dt);
    dt *= 0.35;
  }

  if (debugState.inputAt) {
    debugState.latency = performance.now() - debugState.inputAt;
    debugState.inputAt = 0;
  }
  debugState.frames++;
  if (t - debugState.fpsAt > 500) {
    debugState.fps = (debugState.frames * 1000) / (t - debugState.fpsAt);
    debugState.frames = 0; debugState.fpsAt = t;
  }

  if (debugState.invincible && game.state === 'playing') {
    game.ships = game.ships.filter((s) => s.dist > CONFIG.island.radius + 0.01);
  }

  const L = layout();

  // Motor WebGL: agua y cielo con iluminación por píxel (fuera de la intro).
  // Vigilancia de rendimiento: si el equipo no puede con el shader (p. ej.
  // render por software), el juego vuelve solo al mar 2D y recupera los 60 fps.
  if (GL && !GL.disabled && GL.on) {
    if (!GL.checkAt) GL.checkAt = t + 4000;
    else if (t > GL.checkAt && debugState.fps > 1 && debugState.fps < 42) {
      GL.disabled = true;
      GL.on = false;
      GL.cv.style.display = 'none';
      console.debug('[FARO] WebGL desactivado por rendimiento (fps', debugState.fps.toFixed(0), ') → mar 2D');
    }
  }
  if (GL && !GL.disabled && !intro.active) {
    GC = gameCamera(L);
    const th2 = themeNow();
    const dNow2 = game.state === 'playing' ? game.difficulty : 0;
    const blood2 = dNow2 > 0.75;
    const superOn2 = game.superActive;
    const bc = (superOn2 ? '255, 230, 150' : currentSkin().beam).split(',').map(Number);
    GL.render(GC, th2, {
      time: t / 1000,
      // La luna ahora se pinta siempre por encima (cielo o mar, ver shader),
      // así que su altura ya no depende de dónde caiga la línea del
      // horizonte en esta pantalla: solo necesita margen para no salirse
      // por arriba ni taparse con el HUD.
      moonX: L.w * 0.8, moonY: Math.max(85, Math.min(L.h * 0.22, 150)),
      moonCol: blood2 ? [0.95, 0.68, 0.6] : [1.0, 0.98, 0.9],
      beamA: game.state === 'ready' ? (t / 1000) * 0.8 : game.beamAngle,
      beamHalf: game.state === 'ready' ? CONFIG.beam.halfWidth : game.beamHalfWidth,
      beamGlow: (game.holding ? 0.75 : 0.45) + (superOn2 ? 0.35 : 0),
      beamCol: [bc[0] / 255, bc[1] / 255, bc[2] / 255],
      danger: Math.max(0, Math.min(1, (dNow2 - 0.5) / 0.5)),
      starSeed: game.seed % 97,
    });
  } else if (GL) {
    GL.on = false;
  }

  game.update(dt);
  handleEvents(L);
  sound.setCharging(game.state === 'playing' && game.holding && game.ships.some((s) => s.charge > 0));
  // Ambiente marítimo: gaviotas/boya cuando toca, y el viento sigue la tensión
  sound.ambientTick(game.state === 'playing' && game.ships.some((s) => s.dist < CONFIG.score.zoneClose));
  if ((debugState.frames & 31) === 0) sound.setTension(game.state === 'playing' ? game.difficulty : 0.08);
  draw(L, dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Gancho para pruebas automatizadas y depuración (no afecta al juego normal).
window.__faro = {
  get game() { return game; },
  get records() { return records; },
  get session() { return session; },
  debugState,
  GreedyBot,
  lastError: null,
};

</script>

if ('serviceWorker' in navigator) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {/* sin SW seguimos jugando */});
  });
}
</script>
