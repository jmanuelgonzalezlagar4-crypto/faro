<noscript><p style="color:#eaf2fa;font-family:sans-serif;padding:2em">FARO necesita JavaScript.</p></noscript>
<script>
// ===== src/config.mjs =====
// FARO — Configuración centralizada. Todas las unidades de distancia están
// normalizadas al radio de juego (1.0 = borde donde aparecen los barcos).
// Ángulos en radianes, tiempos en segundos.

const CONFIG = {
  island: {
    radius: 0.14, // radio de las rocas: un barco que llega aquí = derrota
  },
  beam: {
    omega: 2.4,      // velocidad angular del haz cuando gira libre (rad/s, un solo sentido)
    halfWidth: 0.22, // semiángulo del cono de luz (rad)
    range: 1.0,      // el haz solo ilumina barcos ya visibles (dist <= range)
    dwell: 0.25,     // segundos de luz sostenida para salvar un barco
  },
  ship: {
    radius: 0.035,           // radio físico del barco (para hitbox angular)
    baseSpeed: [0.06, 0.24], // velocidad radial [dificultad 0, dificultad 1]
    corsairSpeedMult: 1.6,
  },
  spawn: {
    interval: [3.4, 0.85], // segundos entre patrones [D=0, D=1]
    maxConcurrent: [1, 6], // barcos simultáneos máximos [D=0, D=1]
    firstDelay: 1.2,       // margen antes del primer barco
  },
  difficulty: {
    timeScale: 90,   // constante de tiempo de la rampa exponencial
    timeWeight: 0.6,
    savesWeight: 0.4,
    savesCap: 50,    // rescates que saturan el término de rescates
    adaptBonus: 0.1, // subida de riqueza de patrones tras racha "al límite"
    adaptStreak: 3,  // rescates al límite seguidos que activan la adaptación
  },
  validator: {
    // Margen de seguridad sobre cada deadline: 15 % al empezar (holgado) y
    // 2 % con dificultad máxima. Siempre factible; el final exige perfección.
    margin: [0.15, 0.02],
    maxTries: 8,     // reintentos de recolocación antes de descartar patrón
  },
  score: {
    base: 10,
    corsairBase: 20,
    zoneMid: 0.66,    // dist < zoneMid  → ×2
    zoneClose: 0.38,  // dist < zoneClose → ×3 ("al límite")
    comboWindow: 3.5, // s entre rescates para mantener la cadena
    comboStep: 5,     // cada N rescates encadenados sube el multiplicador
    comboMax: 4,      // multiplicador de combo máximo
  },
  wave: {
    size: 10,     // rescates por ola
    lull: 2.5,    // descanso sin apariciones tras cada ola
  },
  shield: {
    max: 2,        // escudos acumulables (los otorga el barco guardián)
    graceLull: 1.2, // respiro sin apariciones tras perder un escudo
  },
  zone: {
    wavesPerZone: 2, // cada N olas se cambia de escenario (fase visual)
    startFloor: 0.14, // dificultad mínima añadida por cada zona de inicio elegida
  },
  power: {
    needed: 10,     // rescates para cargar el SUPERFARO
    duration: 4.5,  // segundos de superfaro activo
    widthMult: 3,   // el cono se ensancha ×3
    dwellMult: 0.15, // la luz salva casi al instante
  },
  items: {
    interval: [15, 9],  // segundos entre objetos flotantes [D=0, D=1]
    minD: 0.12,         // dificultad mínima para que aparezcan
    lifetime: 9,        // segundos antes de hundirse
    dwell: 0.35,        // luz sostenida para recogerlos
    dist: [0.45, 0.8],  // franja radial donde flotan
    anchorSlow: 0.45,   // el ancla multiplica la velocidad de los barcos
    anchorTime: 5,      // duración del ancla
    flareZone: 0.55,    // la bengala salva los barcos con dist > este valor
    energyBonus: 5,     // rescates de carga que regala la batería
  },
  cargo: {
    hits: 2,        // el carguero necesita 2 iluminaciones completas
    pushBack: 0.09, // retrocede al recibir la primera
    base: 30,       // puntos base (triple)
  },
  restart: {
    lockout: 0.4, // s tras la derrota antes de aceptar la pulsación de reinicio
  },
  // Arco emocional en tres actos: tempestad aparente → lluvia de regalos →
  // "el engaño" (rampa real). La fase 1 PARECE difícil (muchos barcos) pero es
  // justa (lentos + validador extra holgado); la fase 2 regala herramientas y
  // monedas; la fase 3 revela que lo anterior era un calentamiento.
  arc: {
    fakeHardUntil: 25,    // s de "tempestad aparente"
    fakeCrowd: 0.3,       // densidad añadida (más barcos a la vez de los que tocan)
    fakeSlow: 0.72,       // …pero más lentos de lo que tocan
    fakeMargin: 0.08,     // margen extra del validador (aún más justo)
    giftUntil: 70,        // hasta cuándo dura la lluvia de regalos
    giftItemMult: 0.35,   // los objetos aparecen ~3× más a menudo
    giftCoinChance: 0.35, // prob. de moneda extra por rescate en la fase de regalos
    giftPowerGain: 2,     // el superfaro carga doble durante los regalos
  },
  inventory: {
    max: 3, // huecos de herramientas guardadas (botones en pantalla)
  },
  // Duelo local: un jugador defiende (farero) y el otro lanza barcos tocando
  // la banda exterior (almirante). El validador impide ataques imposibles.
  duel: {
    time: 90,        // s que debe aguantar el farero para ganar
    cooldown: 1.1,   // s entre lanzamientos del almirante
    margin: 0.1,     // margen de justicia de cada lanzamiento
    maxShips: 5,     // barcos simultáneos máximos del almirante
    rampTime: 60,    // s hasta que los barcos lanzados alcanzan velocidad máxima
    corsairAfter: 30, // a partir de aquí el almirante lanza corsarios (rápidos)
  },
  checkpoint: {
    every: 3, // cada N fases superadas se guarda un punto de control
  },
  // Mezcla de flota por región (multiplica el peso de cada patrón; el
  // validador de justicia sigue aplicándose igual). Indexado por zona % 12.
  regionMix: [
    { cargo: 1.6 },                    // Galicia: pesqueros y mercantes
    { single: 1.3 },                   // Algarve: tráfico tranquilo
    { pair_opposite: 1.3, cargo: 1.3 }, // Bretaña: ferris cruzando
    { cargo: 1.8, convoy: 1.2 },       // Fiordos: cargueros pesados
    { pair_opposite: 1.5, fan: 1.2 },  // Grecia: rutas cruzadas
    { corsair: 1.5 },                  // Amalfi: lanchas veloces
    { corsair: 1.6, single: 1.2 },     // Caribe: lanchas por todas partes
    { cargo: 2.2 },                    // Tokio: portacontenedores
    { single: 1.4 },                   // Escocia: pesqueros solitarios
    { convoy: 1.5, cargo: 1.4 },       // Cabo: convoyes mercantes
    { fan: 1.3, corsair: 1.2 },        // Gran Barrera: tráfico turístico
    { cargo: 1.7, convoy: 1.2 },       // Islandia: rutas de carga
  ],
  // Sorpresas: eventos aleatorios que ayudan o complican (siempre justos)
  surprise: {
    first: 30,           // s hasta la primera sorpresa
    interval: [55, 30],  // s entre sorpresas [D=0, D=1]
    pirateSpeedMult: 1.45, // el pirata es rápido (y al iluminarlo SE HUNDE)
    pirateBase: 40,      // puntos base del pirata (el botín)
    tugTime: 9,          // s que el remolcador aliado está en el agua
    tugPeriod: 3.2,      // cada cuánto remolca (auto-rescata) un barco
    fogTime: 8,          // s de niebla (solo visual: las reglas no cambian)
    wavePush: 0.12,      // la ola gigante empuja a todos los barcos hacia atrás
  },
};


// ===== src/core.mjs =====
// FARO — Núcleo de juego 100 % headless (sin DOM, sin canvas).
// Contiene: RNG con semilla, dificultad, patrones, validador de factibilidad,
// puntuación, estado de partida y bot greedy (usado por QA).
//
// MECÁNICA (v2, tras QA): el haz del faro gira solo, siempre en el mismo
// sentido. MANTENER PULSADO detiene el haz: los barcos dentro del cono se
// cargan de luz y se salvan tras `dwell` segundos iluminados. Soltar reanuda
// el giro. No pulsar nunca = derrota; pulsar siempre = derrota.
// (La v1 "tocar invierte el giro" se descartó: la estrategia pasiva de no
// tocar nada era inmortal — el barrido continuo lo salvaba todo solo.)


const TAU = Math.PI * 2;

// ---------- RNG determinista (mulberry32) ----------

/** @param {number} seed @returns {() => number} uniforme [0,1) */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Semilla numérica a partir de una cadena (p. ej. fecha para el reto diario). */
function hashSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// ---------- Geometría angular ----------

/** Normaliza un ángulo a [0, TAU). */
function wrap(a) {
  a %= TAU;
  return a < 0 ? a + TAU : a;
}

/** Distancia angular mínima entre dos ángulos, en [0, PI]. */
function angDist(a, b) {
  const d = Math.abs(wrap(a) - wrap(b));
  return d > Math.PI ? TAU - d : d;
}

/** Distancia angular AVANZANDO en el sentido del haz (de a hacia b), [0, TAU). */
function angForward(a, b) {
  return wrap(b - a);
}

// ---------- Dificultad ----------

/**
 * Dificultad D en [0,1]: rampa exponencial por tiempo + término por rescates.
 * @param {number} t segundos de partida
 * @param {number} saves rescates acumulados
 */
function difficulty(t, saves, cfg = CONFIG) {
  const d = cfg.difficulty;
  const byTime = 1 - Math.exp(-t / d.timeScale);
  const bySaves = Math.min(1, saves / d.savesCap);
  return Math.min(1, Math.max(0, d.timeWeight * byTime + d.savesWeight * bySaves));
}

/** Interpolación lineal entre par [inicio, final] según D. */
function lerpByD(pair, D) {
  return pair[0] + (pair[1] - pair[0]) * D;
}

// ---------- Barcos y patrones ----------

let nextShipId = 1;

/**
 * @param {number} angle @param {number} dist @param {number} speed
 * @param {'normal'|'corsair'|'guardian'} type
 */
function makeShip(angle, dist, speed, type = 'normal', hits = 1) {
  return { id: nextShipId++, angle: wrap(angle), dist, speed, type, born: 0, charge: 0, hits };
}

/** Objeto flotante recogible iluminándolo. */
function makeItem(rng, type, cfg = CONFIG) {
  const [d0, d1] = cfg.items.dist;
  return {
    id: nextShipId++, type, angle: rng() * TAU,
    dist: d0 + rng() * (d1 - d0), charge: 0, expiresIn: cfg.items.lifetime,
  };
}

const ITEM_TYPES = ['ancla', 'bengala', 'energia'];

/** Escenario (zona) que corresponde a un número de olas superadas. */
function zoneIndexFor(wavesCleared, cfg = CONFIG) {
  return Math.floor(wavesCleared / cfg.zone.wavesPerZone);
}

/**
 * Biblioteca de patrones. Cada patrón devuelve una lista de barcos candidatos
 * (dist >= 1.0; los escalonados nacen más allá del borde y navegan hacia él).
 * minD = dificultad mínima para que el patrón pueda aparecer.
 */
const PATTERNS = [
  {
    name: 'single', minD: 0,
    build: (rng, speed) => [makeShip(rng() * TAU, 1.0, speed)],
  },
  {
    // Barco guardián: rescatarlo otorga un escudo (absorbe un choque).
    // Poco frecuente (weight) para que el escudo se sienta valioso.
    name: 'guardian', minD: 0.18, weight: 0.2,
    build: (rng, speed) => [makeShip(rng() * TAU, 1.0, speed, 'guardian')],
  },
  {
    name: 'pair_opposite', minD: 0.15,
    build: (rng, speed) => {
      const a = rng() * TAU;
      return [makeShip(a, 1.0, speed), makeShip(a + Math.PI, 1.16, speed)];
    },
  },
  {
    name: 'corsair', minD: 0.25,
    build: (rng, speed, cfg) =>
      [makeShip(rng() * TAU, 1.0, speed * cfg.ship.corsairSpeedMult, 'corsair')],
  },
  {
    name: 'fan', minD: 0.35,
    build: (rng, speed) => {
      const a = rng() * TAU;
      return [
        makeShip(a, 1.0, speed),
        makeShip(a - 0.55, 1.12, speed),
        makeShip(a + 0.55, 1.12, speed),
      ];
    },
  },
  {
    // Uno justo por delante del haz y otro justo por detrás: el de detrás
    // exige casi una vuelta completa → decisión de orden dramática.
    name: 'pincer', minD: 0.45,
    build: (rng, speed, cfg, beamAngle) => [
      makeShip(beamAngle + Math.PI / 2, 1.0, speed),
      makeShip(beamAngle - Math.PI / 2, 1.14, speed),
    ],
  },
  {
    // Convoy angularmente apretado: cabe entero en el cono → rescate múltiple.
    name: 'convoy', minD: 0.5,
    build: (rng, speed) => {
      const a = rng() * TAU;
      return [
        makeShip(a, 1.0, speed),
        makeShip(a + 0.12, 1.18, speed),
        makeShip(a - 0.12, 1.36, speed),
      ];
    },
  },
  {
    // Carguero: lento y pesado, necesita DOS iluminaciones completas.
    name: 'cargo', minD: 0.55, weight: 0.5,
    build: (rng, speed, cfg) =>
      [makeShip(rng() * TAU, 1.0, speed * 0.75, 'cargo', cfg.cargo.hits)],
  },
];

// ---------- Validador de factibilidad ----------

/**
 * Certificado de justicia: simula un plan greedy por deadline (EDF) con el
 * movimiento real del haz: solo avanza en un sentido y debe detenerse `dwell`
 * segundos sobre cada barco. Cada barco debe poder alcanzarse e iluminarse
 * antes de que llegue a las rocas, con margen de seguridad.
 * Es conservador (un orden más listo podría superar algo que EDF no):
 * conservador = nunca se cuela un patrón injusto.
 * @param {Array<{angle:number,dist:number,speed:number}>} ships activos + candidatos
 * @param {number} beamAngle ángulo actual del haz
 * @param {number} [marginFrac] margen de seguridad (por defecto, el más holgado)
 * @returns {boolean} true si el conjunto es superable
 */
function isFeasible(ships, beamAngle, cfg = CONFIG, marginFrac = cfg.validator.margin[0]) {
  const islandR = cfg.island.radius;
  const margin = 1 - marginFrac;
  const omega = cfg.beam.omega;
  const half = cfg.beam.halfWidth;
  const dwell = cfg.beam.dwell;
  const list = ships
    .map((s) => ({
      angle: s.angle,
      needs: dwell * (s.hits || 1), // el carguero exige dos iluminaciones
      deadline: (s.dist - islandR) / s.speed, // s hasta las rocas
    }))
    .sort((a, b) => a.deadline - b.deadline);

  let t = 0;
  let at = beamAngle;
  for (const s of list) {
    const gap = angForward(at, s.angle);
    const travel = gap <= half ? 0 : (gap - half) / omega;
    t += travel + s.needs;
    if (t > s.deadline * margin) return false;
    at = s.angle;
  }
  return true;
}

/**
 * Intenta colocar un patrón de forma factible: si el conjunto resultante no
 * pasa el validador, regenera/rota el patrón y reintenta.
 * @returns {Array|null} barcos listos para entrar en juego, o null si se descarta
 */
function placePattern(pattern, rng, speed, activeShips, beamAngle, cfg = CONFIG,
  marginFrac = cfg.validator.margin[0]) {
  for (let i = 0; i < cfg.validator.maxTries; i++) {
    const candidates = pattern.build(rng, speed, cfg, beamAngle);
    if (isFeasible([...activeShips, ...candidates], beamAngle, cfg, marginFrac)) {
      return candidates;
    }
  }
  return null; // ningún patrón infactible entra en juego
}

// ---------- Puntuación ----------

/** Zona de riesgo según distancia: 1 lejos, 2 media, 3 "al límite". */
function zoneOf(dist, cfg = CONFIG) {
  if (dist < cfg.score.zoneClose) return 3;
  if (dist < cfg.score.zoneMid) return 2;
  return 1;
}

/** Multiplicador de combo según longitud de cadena. */
function comboMult(chain, cfg = CONFIG) {
  return Math.min(cfg.score.comboMax, 1 + Math.floor(chain / cfg.score.comboStep));
}

// ---------- Partida ----------

/**
 * Estado y reglas de una partida. Sin dependencias de navegador.
 * La UI (o el bot) llama a down()/up() y update(dt) y drena events.
 */
class Game {
  /**
   * @param {number} seed @param {object} cfg
   * @param {{startZone?: number, startWave?: number, duel?: boolean}} [opts]
   */
  constructor(seed, cfg = CONFIG, opts = {}) {
    this.cfg = cfg;
    this.seed = seed >>> 0;
    this.rng = mulberry32(this.seed);
    this.state = 'ready'; // ready → playing → over
    this.time = 0;
    this.beamAngle = this.rng() * TAU;
    this.holding = false;
    /** @type {Array<ReturnType<typeof makeShip>>} */
    this.ships = [];
    /** @type {Array<ReturnType<typeof makeItem>>} */
    this.items = [];
    this.itemTimer = 6;
    /** Punto de control: empezar con N fases ya superadas (sin puntos regalados). */
    this.startWave = Math.max(0, opts.startWave || 0);
    this.startZone = Math.max(0, opts.startZone || 0, zoneIndexFor(this.startWave, cfg));
    /** Duelo local: sin generación automática; los barcos los lanza el almirante. */
    this.duel = !!opts.duel;
    this.duelCd = 0;
    this.duelEnded = false;
    /** Herramientas guardadas (ancla/bengala) usables con un toque. */
    this.inventory = [];
    this.bonusCoins = 0;
    // Reinicios desde punto de control y duelo: sin teatro de bienvenida
    // (ni anuncio de regalos ni "engaño")
    this.taunted = this.duel || this.startWave > 0;
    this.giftAnnounced = this.taunted;
    this.power = 0;
    this.superUntil = -1;
    this.anchorUntil = -1;
    this.score = 0;
    this.saves = 0;
    this.shields = 0;
    this.zoneIndex = this.startZone;
    this.chain = 0;
    this.bestChain = 0;
    this.lastSaveAt = -Infinity;
    this.closeStreak = 0;
    this.adapted = false;
    this.spawnTimer = cfg.spawn.firstDelay;
    this.lullUntil = 0;
    this.wavesCleared = this.startWave;
    // Sorpresas (piratas, remolcador aliado, ola gigante, niebla)
    this.surpriseTimer = cfg.surprise ? cfg.surprise.first : Infinity;
    this.tugUntil = -1;
    this.tugTimer = 0;
    this.fogUntil = -1;
    this.deathCause = null;
    this.overAt = 0;
    /** Cola de eventos para la capa de presentación. */
    this.events = [];
    this.presses = 0;
  }

  get difficulty() {
    const base = difficulty(this.time, this.saves, this.cfg);
    // Empezar en una zona avanzada impone un suelo de dificultad acorde
    const floor = Math.min(0.85, this.startZone * this.cfg.zone.startFloor);
    return Math.max(base, floor);
  }

  /** Acto del arco emocional: 'tempest' (difícil aparente) → 'gift' → 'real'.
   * Los reinicios desde punto de control y el duelo van directos al acto real. */
  get phase() {
    const arc = this.cfg.arc;
    if (!arc || this.startWave > 0 || this.duel) return 'real';
    if (this.time < arc.fakeHardUntil) return 'tempest';
    if (this.time < arc.giftUntil) return 'gift';
    return 'real';
  }

  /** ¿SUPERFARO activo? */
  get superActive() {
    return this.time < this.superUntil;
  }

  /** Activa el SUPERFARO si la carga está completa (doble toque en la UI). */
  activateSuper() {
    if (this.state !== 'playing') return false;
    if (this.power < this.cfg.power.needed || this.superActive) return false;
    this.power = 0;
    this.superUntil = this.time + this.cfg.power.duration;
    this.events.push({ type: 'super_on', until: this.superUntil });
    return true;
  }

  /** Dificultad usada para elegir patrones (incluye adaptación positiva). */
  get patternD() {
    return Math.min(1, this.difficulty + (this.adapted ? this.cfg.difficulty.adaptBonus : 0));
  }

  /** Pulsación (pointerdown / keydown): empezar, iluminar o pedir reinicio. */
  down() {
    if (this.state === 'ready') {
      this.state = 'playing';
      this.events.push({ type: 'start' });
      return;
    }
    if (this.state === 'playing') {
      if (!this.holding) {
        this.holding = true;
        this.presses++;
        this.events.push({ type: 'press' });
      }
      return;
    }
    // 'over': el reinicio lo gestiona la capa exterior creando un Game nuevo
    // (garantiza estado limpio); aquí solo se señala si pasó el lockout.
    if (this.time - this.overAt >= this.cfg.restart.lockout) {
      this.events.push({ type: 'restart' });
    }
  }

  /** Fin de pulsación (pointerup / keyup): el haz reanuda el giro. */
  up() {
    if (this.holding) {
      this.holding = false;
      this.events.push({ type: 'release' });
    }
  }

  /** Semiancho efectivo del cono (el superfaro lo ensancha). */
  get beamHalfWidth() {
    return this.cfg.beam.halfWidth * (this.superActive ? this.cfg.power.widthMult : 1);
  }

  /** Dwell efectivo (el superfaro salva casi al instante). */
  get beamDwell() {
    return this.cfg.beam.dwell * (this.superActive ? this.cfg.power.dwellMult : 1);
  }

  /** ¿Está este barco dentro del cono de luz y a la vista? */
  #lit(s) {
    const cfg = this.cfg;
    if (s.dist > cfg.beam.range) return false;
    const angRad = Math.min(0.5, cfg.ship.radius / Math.max(s.dist, cfg.island.radius));
    return angDist(this.beamAngle, s.angle) <= this.beamHalfWidth + angRad;
  }

  /** @param {number} dt segundos (la capa exterior lo limita a <= 50 ms) */
  update(dt) {
    this.time += dt;
    if (this.state !== 'playing') return;

    const cfg = this.cfg;
    const D = this.difficulty;

    // Duelo: cuenta atrás del almirante y victoria del farero por resistencia
    if (this.duel) {
      this.duelCd = Math.max(0, this.duelCd - dt);
      if (!this.duelEnded && this.time >= cfg.duel.time) {
        this.duelEnded = true;
        this.state = 'over';
        this.overAt = this.time;
        this.holding = false;
        this.events.push({ type: 'duel_end', winner: 'farero' });
        return;
      }
    }

    // Haz: gira libre; detenido mientras se mantiene pulsado
    if (!this.holding) {
      this.beamAngle = wrap(this.beamAngle + cfg.beam.omega * dt);
    }

    // Barcos: avanzan hacia las rocas; se cargan de luz si están iluminados.
    // El ancla los ralentiza mientras dura.
    const speedMult = this.time < this.anchorUntil ? cfg.items.anchorSlow : 1;
    for (let i = this.ships.length - 1; i >= 0; i--) {
      const s = this.ships[i];
      s.dist -= s.speed * speedMult * dt;
      if (this.holding && this.#lit(s)) {
        s.charge += dt;
        if (s.charge >= this.beamDwell) {
          if ((s.hits || 1) > 1) {
            // Carguero: primera luz completada → retrocede y pide otra pasada
            s.hits--;
            s.charge = 0;
            s.dist = Math.min(1.0, s.dist + cfg.cargo.pushBack);
            this.events.push({ type: 'cargo_hit', ship: s });
          } else {
            this.ships.splice(i, 1);
            this.#onSave(s);
          }
          continue;
        }
      } else {
        s.charge = 0;
      }
    }

    // Objetos flotantes: caducan, y se recogen iluminándolos
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];
      it.expiresIn -= dt;
      if (it.expiresIn <= 0) {
        this.items.splice(i, 1);
        this.events.push({ type: 'item_lost', item: it });
        continue;
      }
      const angRad = Math.min(0.5, cfg.ship.radius / it.dist);
      const litItem = this.holding && angDist(this.beamAngle, it.angle) <= this.beamHalfWidth + angRad;
      if (litItem) {
        it.charge += dt;
        if (it.charge >= cfg.items.dwell) {
          this.items.splice(i, 1);
          this.#onItem(it);
        }
      } else {
        it.charge = 0;
      }
    }

    // Aviso de fin de superfaro
    if (this.superUntil > 0 && !this.superActive) {
      this.superUntil = -1;
      this.events.push({ type: 'super_off' });
    }

    // Choques: un barco alcanza las rocas → escudo o derrota
    for (let i = this.ships.length - 1; i >= 0; i--) {
      const s = this.ships[i];
      if (s.dist <= cfg.island.radius) {
        if (this.shields > 0) {
          this.shields--;
          this.ships.splice(i, 1);
          this.lullUntil = Math.max(this.lullUntil, this.time + cfg.shield.graceLull);
          this.events.push({ type: 'shield_break', ship: s, shields: this.shields });
        } else {
          this.#gameOver(s);
          return;
        }
      }
    }

    // Caducidad del combo
    if (this.chain > 0 && this.time - this.lastSaveAt > cfg.score.comboWindow) {
      this.chain = 0;
      this.events.push({ type: 'combo_lost' });
    }

    // Generación de barcos (en duelo los lanza el almirante, no el mar)
    if (!this.duel && this.time >= this.lullUntil) {
      this.spawnTimer -= dt;
      if (this.spawnTimer <= 0) this.#spawn(D);
    }

    // Sorpresas: aliados y enemigos inesperados (nunca en el duelo)
    if (!this.duel && this.cfg.surprise) {
      this.surpriseTimer -= dt;
      if (this.surpriseTimer <= 0) this.#surprise(D);
      // Remolcador aliado: remolca (rescata) el barco más cercano a las rocas
      if (this.time < this.tugUntil && this.ships.length > 0) {
        this.tugTimer -= dt;
        if (this.tugTimer <= 0) {
          this.tugTimer = this.cfg.surprise.tugPeriod;
          let best = null;
          for (const s of this.ships) {
            if (s.type === 'guardian') continue; // al guardián lo rescatas tú
            if (!best || s.dist < best.dist) best = s;
          }
          if (best) {
            this.ships.splice(this.ships.indexOf(best), 1);
            this.events.push({ type: 'tug_save', ship: best });
            this.#onSave(best);
          }
        }
      }
    }

    // Anuncios del arco: empieza la lluvia de regalos / se revela "el engaño"
    if (cfg.arc) {
      if (!this.giftAnnounced && this.phase === 'gift') {
        this.giftAnnounced = true;
        this.events.push({ type: 'gift_start' });
      }
      if (!this.taunted && this.phase === 'real') {
        this.taunted = true;
        this.events.push({ type: 'taunt' });
      }
    }

    // Generación de objetos flotantes (llueven durante la fase de regalos)
    if (!this.duel && (D >= cfg.items.minD || this.phase === 'gift')) {
      this.itemTimer -= dt;
      if (this.itemTimer <= 0) {
        const type = ITEM_TYPES[Math.floor(this.rng() * ITEM_TYPES.length)];
        const item = makeItem(this.rng, type, cfg);
        this.items.push(item);
        this.events.push({ type: 'item_spawn', item });
        const giftMult = this.phase === 'gift' ? cfg.arc.giftItemMult : 1;
        this.itemTimer = lerpByD(cfg.items.interval, D) * giftMult;
      }
    }
  }

  /**
   * Lanzamiento del almirante en el duelo: crea un barco en `angle` rumbo al
   * faro. Respeta cooldown, tope de barcos y el validador de justicia — el
   * almirante no puede fabricar situaciones imposibles.
   * @returns {boolean} true si el barco zarpó
   */
  duelSpawn(angle) {
    if (!this.duel || this.state !== 'playing' || this.duelEnded) return false;
    const d = this.cfg.duel;
    if (this.duelCd > 0) { this.events.push({ type: 'duel_cd', angle }); return false; }
    if (this.ships.length >= d.maxShips) { this.events.push({ type: 'duel_full', angle }); return false; }
    const k = Math.min(1, this.time / d.rampTime);
    const base = lerpByD(this.cfg.ship.baseSpeed, k);
    const corsair = this.time >= d.corsairAfter && this.rng() < 0.35;
    const ship = makeShip(angle, 1.0,
      corsair ? base * this.cfg.ship.corsairSpeedMult : base,
      corsair ? 'corsair' : 'normal');
    if (!isFeasible([...this.ships, ship], this.beamAngle, this.cfg, d.margin)) {
      this.events.push({ type: 'duel_reject', angle });
      return false;
    }
    ship.born = this.time;
    this.ships.push(ship);
    this.duelCd = d.cooldown;
    this.events.push({ type: 'duel_spawn', ship });
    return true;
  }

  /** Aplica el efecto de una herramienta (ancla/bengala). */
  #applyTool(type) {
    const cfg = this.cfg;
    if (type === 'ancla') {
      this.anchorUntil = this.time + cfg.items.anchorTime;
    } else if (type === 'bengala') {
      // La bengala salva de golpe los barcos aún lejanos (zona ×1)
      for (let i = this.ships.length - 1; i >= 0; i--) {
        if (this.ships[i].dist > cfg.items.flareZone) {
          const s = this.ships.splice(i, 1)[0];
          this.#onSave(s);
        }
      }
    }
  }

  /**
   * Usa la herramienta guardada en el hueco `index` (botones de la UI).
   * @returns {boolean} true si se usó
   */
  useTool(index) {
    if (this.state !== 'playing') return false;
    const type = this.inventory[index];
    if (!type) return false;
    this.inventory.splice(index, 1);
    this.#applyTool(type);
    this.events.push({ type: 'tool_use', tool: type });
    return true;
  }

  /** Efecto de recoger un objeto flotante. */
  #onItem(item) {
    const cfg = this.cfg;
    if (item.type === 'energia') {
      this.power = Math.min(cfg.power.needed, this.power + cfg.items.energyBonus);
      this.events.push({ type: 'item_get', item });
      return;
    }
    // Ancla y bengala se GUARDAN: botones en pantalla, se usan cuando quieras.
    const max = cfg.inventory ? cfg.inventory.max : 0;
    if (this.inventory.length < max) {
      this.inventory.push(item.type);
      this.events.push({ type: 'tool_stash', tool: item.type, slots: this.inventory.slice() });
    } else {
      this.#applyTool(item.type); // inventario lleno → efecto inmediato
      this.events.push({ type: 'item_get', item });
    }
  }

  #onSave(ship) {
    const cfg = this.cfg;
    const zone = zoneOf(ship.dist, cfg);
    if (this.time - this.lastSaveAt <= cfg.score.comboWindow) this.chain++;
    else this.chain = 1;
    this.lastSaveAt = this.time;
    this.bestChain = Math.max(this.bestChain, this.chain);

    const mult = comboMult(this.chain, cfg);
    const base = ship.type === 'corsair' ? cfg.score.corsairBase
      : ship.type === 'cargo' ? cfg.cargo.base
      : ship.type === 'pirate' && cfg.surprise ? cfg.surprise.pirateBase
      : cfg.score.base;
    const points = base * zone * mult;
    this.score += points;
    this.saves++;
    const inGift = this.phase === 'gift';
    const gain = inGift && cfg.arc ? cfg.arc.giftPowerGain : 1;
    this.power = Math.min(cfg.power.needed, this.power + gain);

    // Lluvia de regalos: monedas extra por rescate
    if (inGift && cfg.arc && this.rng() < cfg.arc.giftCoinChance) {
      this.bonusCoins++;
      this.events.push({ type: 'coin', total: this.bonusCoins, atAngle: ship.angle, atDist: ship.dist });
    }

    // Adaptación positiva: rachas "al límite" → patrones más ricos
    this.closeStreak = zone === 3 ? this.closeStreak + 1 : 0;
    if (this.closeStreak >= cfg.difficulty.adaptStreak) this.adapted = true;
    if (zone === 1) this.adapted = false;

    this.events.push({
      type: 'save', ship, zone, points, chain: this.chain, mult,
      atDist: ship.dist,
    });

    // Guardián rescatado → escudo (con tope)
    if (ship.type === 'guardian' && this.shields < cfg.shield.max) {
      this.shields++;
      this.events.push({ type: 'shield', shields: this.shields });
    }

    // Olas, descansos y cambio de escenario
    if (this.saves % cfg.wave.size === 0) {
      this.wavesCleared++;
      this.lullUntil = this.time + cfg.wave.lull;
      this.events.push({ type: 'wave', n: this.wavesCleared });
      const zi = this.startZone + zoneIndexFor(this.wavesCleared, cfg);
      if (zi !== this.zoneIndex) {
        this.zoneIndex = zi;
        this.events.push({ type: 'zone', index: zi });
      }
    }
  }

  /** Lanza una sorpresa aleatoria: pirata, remolcador, ola gigante o niebla. */
  #surprise(D) {
    const cfg = this.cfg;
    const sp = cfg.surprise;
    this.surpriseTimer = lerpByD(sp.interval, D);
    const roll = this.rng();
    if (roll < 0.34) {
      // 🏴‍☠️ Pirata: rápido, paga botín y SE HUNDE al iluminarlo.
      // Pasa por el validador: si no cabe con justicia, no aparece.
      const speed = lerpByD(cfg.ship.baseSpeed, D) * sp.pirateSpeedMult;
      const pattern = {
        name: 'pirate',
        build: (rng) => [makeShip(rng() * TAU, 1.0, speed, 'pirate')],
      };
      const marginFrac = lerpByD(cfg.validator.margin, D);
      const placed = placePattern(pattern, this.rng, speed, this.ships, this.beamAngle, cfg, marginFrac);
      if (placed) {
        for (const s of placed) { s.born = this.time; this.ships.push(s); }
        this.events.push({ type: 'surprise', kind: 'pirate', ship: placed[0] });
      }
    } else if (roll < 0.58) {
      // ⛵ Remolcador aliado: durante unos segundos remolca barcos a puerto
      this.tugUntil = this.time + sp.tugTime;
      this.tugTimer = sp.tugPeriod;
      this.events.push({ type: 'surprise', kind: 'tug', until: this.tugUntil });
    } else if (roll < 0.8) {
      // 🌊 Ola gigante: empuja a todos los barcos mar adentro (un respiro)
      for (const s of this.ships) s.dist = Math.min(1.0, s.dist + sp.wavePush);
      this.events.push({ type: 'surprise', kind: 'wave' });
    } else {
      // 🌫️ Niebla: puramente visual — las reglas y la justicia no cambian
      this.fogUntil = this.time + sp.fogTime;
      this.events.push({ type: 'surprise', kind: 'fog', until: this.fogUntil });
    }
  }

  #spawn(D) {
    const cfg = this.cfg;
    // Tempestad aparente: MÁS barcos de los que tocan (parece difícil) pero
    // más LENTOS y con validador extra holgado (en realidad es más justo).
    const inFake = cfg.arc && this.phase === 'tempest';
    const crowdD = inFake ? Math.min(1, D + cfg.arc.fakeCrowd) : D;
    const maxShips = Math.round(lerpByD(cfg.spawn.maxConcurrent, crowdD));
    if (this.ships.length < maxShips) {
      const pd = this.patternD;
      const pool = PATTERNS.filter((p) => pd >= p.minD);
      // Selección ponderada (los patrones raros declaran weight < 1) con la
      // mezcla de flota de la región actual (Tokio = más mercantes, etc.)
      const mix = cfg.regionMix ? cfg.regionMix[this.zoneIndex % cfg.regionMix.length] : null;
      const wOf = (p) => (p.weight ?? 1) * (mix && mix[p.name] ? mix[p.name] : 1);
      const total = pool.reduce((acc, p) => acc + wOf(p), 0);
      let roll = this.rng() * total;
      let pattern = pool[pool.length - 1];
      for (const p of pool) {
        roll -= wOf(p);
        if (roll <= 0) { pattern = p; break; }
      }
      const speed = lerpByD(cfg.ship.baseSpeed, D) * (inFake ? cfg.arc.fakeSlow : 1);
      const marginFrac = lerpByD(cfg.validator.margin, D) + (inFake ? cfg.arc.fakeMargin : 0);
      const placed = placePattern(pattern, this.rng, speed, this.ships, this.beamAngle, cfg, marginFrac);
      if (placed) {
        for (const s of placed) {
          s.born = this.time;
          this.ships.push(s);
        }
        this.events.push({ type: 'spawn', pattern: pattern.name, count: placed.length });
      }
    }
    this.spawnTimer = lerpByD(cfg.spawn.interval, crowdD);
  }

  #gameOver(culprit) {
    this.state = 'over';
    this.overAt = this.time;
    this.holding = false;
    this.deathCause = {
      shipId: culprit.id,
      type: culprit.type,
      angle: culprit.angle,
      aliveFor: this.time - culprit.born,
      atTime: this.time,
      score: this.score,
      seed: this.seed,
    };
    this.events.push({ type: 'over', culprit, cause: this.deathCause });
  }
}

// ---------- Bot greedy (QA) ----------

/**
 * Política greedy: perseguir siempre el barco visible con el deadline más
 * próximo; pulsar cuando entra en el cono y mantener hasta salvarlo.
 * Si el bot muere pese a patrones factibles, la rampa está apretando de veras.
 */
class GreedyBot {
  constructor(game) {
    this.game = game;
    /** @type {number|null} id del barco que está iluminando */
    this.lockedId = null;
  }

  /** Llamar una vez por tick, después de game.update(). */
  act() {
    const g = this.game;
    if (g.state === 'ready') { g.down(); g.up(); return; }
    if (g.state !== 'playing') return;

    const cfg = g.cfg;
    let target = null;
    let best = Infinity;
    for (const s of g.ships) {
      if (s.dist > cfg.beam.range) continue; // aún no visible
      const deadline = (s.dist - cfg.island.radius) / s.speed;
      if (deadline < best) { best = deadline; target = s; }
    }

    if (g.holding) {
      const locked = g.ships.find((s) => s.id === this.lockedId);
      if (!locked) { g.up(); this.lockedId = null; return; } // salvado
      // El haz está congelado: si el objetivo quedó fuera del cono o aún no es
      // visible, la puntería falló → soltar (comprobación geométrica, sin
      // depender del orden bot/update).
      const angRad = Math.min(0.5, cfg.ship.radius / Math.max(locked.dist, cfg.island.radius));
      const miss = angDist(g.beamAngle, locked.angle) > cfg.beam.halfWidth + angRad ||
        locked.dist > cfg.beam.range;
      if (miss) { g.up(); this.lockedId = null; }
      return; // si no, seguir iluminando
    }

    if (!target) return;
    const gap = angDist(g.beamAngle, target.angle);
    if (gap <= cfg.beam.halfWidth * 0.6) {
      this.lockedId = target.id;
      g.down();
    }
  }
}

/**
 * Simula una partida completa con el bot a paso fijo.
 * @returns {{time:number, score:number, saves:number, seed:number, cause:object|null, bestChain:number}}
 */
function simulate(seed, maxSeconds = 300, cfg = CONFIG) {
  const game = new Game(seed, cfg);
  const bot = new GreedyBot(game);
  const dt = 1 / 120;
  let guard = Math.ceil(maxSeconds / dt);
  while (game.state !== 'over' && guard-- > 0) {
    bot.act();
    game.update(dt);
    game.events.length = 0; // drenar como haría la UI
  }
  return {
    time: game.time, score: game.score, saves: game.saves,
    seed, cause: game.deathCause, bestChain: game.bestChain,
  };
}

const store = (() => {
  const mem = {};
  let ok = true;
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); }
  catch { ok = false; }
  return {
    get(k, fallback) {

        return v == null ? fallback : JSON.parse(v);

    },
    set(k, v) {

  };
})();

// ---------- Audio sintetizado ----------
class Sound {
  constructor() {
    this.ctx = null;
    this.muted = store.get('faro.muted', false);
    this.chargeOsc = null;
    // La melodía de la racha: escala pentatónica ascendente
    this.scale = [220, 246.9, 293.7, 329.6, 392, 440, 493.9, 587.3, 659.3, 784];
  }
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      const p = this.ctx.resume();
      if (p && p.catch) p.catch(() => { /* visores sin activación de usuario */ });
    }
    this.startAmbience();
  }
  toggleMute() {
    this.muted = !this.muted;
    store.set('faro.muted', this.muted);
    if (this.ambGain && this.ctx) this.ambGain.gain.value = this.muted ? 0 : 1;
  }

  /** Búfer de ruido blanco reutilizable (2 s, en bucle). */
  #noise() {
    if (!this.noiseBuf) {
      const n = this.ctx.sampleRate * 2;
      this.noiseBuf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.loop = true;
    return src;
  }

  /**
   * Ambiente marítimo continuo, 100 % sintetizado: oleaje (ruido grave con
   * vaivén), viento (ruido medio, sube con la tensión) y gaviotas/boya
   * ocasionales. Arranca con el primer gesto del usuario.
   */
  startAmbience() {
    if (this.ambOn || !this.ctx || this.ctx.state !== 'running') return;
    this.ambOn = true;
    const c = this.ctx;
    this.ambGain = c.createGain();
    this.ambGain.gain.value = this.muted ? 0 : 1;
    this.ambGain.connect(c.destination);
    // Oleaje: ruido por paso-bajo con LFO lento en la ganancia (vaivén)
    const surf = this.#noise();
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
    const sg = c.createGain(); sg.gain.value = 0.05;
    const lfo = c.createOscillator(); lfo.frequency.value = 0.09;
    const lfoG = c.createGain(); lfoG.gain.value = 0.028;
    lfo.connect(lfoG).connect(sg.gain);
    surf.connect(lp).connect(sg).connect(this.ambGain);
    surf.start(); lfo.start();
    // Viento: ruido por paso-banda; su nivel lo fija setTension()
    const wind = this.#noise();
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = 0.6;
    this.windGain = c.createGain(); this.windGain.gain.value = 0.006;
    wind.connect(bp).connect(this.windGain).connect(this.ambGain);
    wind.start();
    // Gaviotas y campana de boya, de vez en cuando (programadas por frame)
    this.nextGull = c.currentTime + 5;
    this.nextBell = c.currentTime + 9;
    // Música de tensión: drone grave (fundamental + quinta) tras un filtro;
    // setTension() lo hace crecer y abrirse con la dificultad
    this.droneFilter = c.createBiquadFilter();
    this.droneFilter.type = 'lowpass';
    this.droneFilter.frequency.value = 160;
    this.droneGain = c.createGain();
    this.droneGain.gain.value = 0.012;
    for (const [f, dt2] of [[55, 0], [82.41, 2]]) {
      const o = c.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = f;
      o.detune.value = dt2;
      const og = c.createGain(); og.gain.value = 0.5;
      o.connect(og).connect(this.droneFilter);
      o.start();
    }
    this.droneFilter.connect(this.droneGain).connect(this.ambGain);
  }

  /** El viento y la música arrecian con la dificultad/tormenta (0..1). */
  setTension(k) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    if (this.windGain) this.windGain.gain.setTargetAtTime(0.006 + 0.03 * Math.min(1, k), t, 0.8);
    if (this.droneGain) {
      this.droneGain.gain.setTargetAtTime(0.012 + 0.03 * Math.min(1, k), t, 1.2);
      this.droneFilter.frequency.setTargetAtTime(160 + 700 * Math.min(1, k) * Math.min(1, k), t, 1.2);
    }
  }

  /** Llamar una vez por frame: dispara gaviotas/boya cuando toca. */
  ambientTick(danger) {
    if (!this.ambOn || this.muted || !this.ctx) return;
    const t = this.ctx.currentTime;
    if (t >= this.nextGull) {
      this.nextGull = t + 9 + Math.random() * 14;
      if (!danger) {
        // Gaviota: dos chirridos descendentes
        for (let i = 0; i < 2; i++) {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = 'sine';
          const t0 = t + i * 0.28;
          o.frequency.setValueAtTime(1550 + Math.random() * 250, t0);
          o.frequency.exponentialRampToValueAtTime(950, t0 + 0.16);
          g.gain.setValueAtTime(0, t0);
          g.gain.linearRampToValueAtTime(0.022, t0 + 0.03);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
          o.connect(g).connect(this.ambGain);
          o.start(t0); o.stop(t0 + 0.25);
        }
      }
    }
    if (t >= this.nextBell) {
      this.nextBell = t + 12 + Math.random() * 10;
      // Campana de boya lejana: parcial metálico doble
      for (const [f, gn] of [[624, 0.016], [938, 0.008]]) {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(gn, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
        o.connect(g).connect(this.ambGain);
        o.start(t); o.stop(t + 1.7);
      }
    }
  }
  #env(freq, type, dur, gain = 0.12, when = 0) {
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(this.ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  press() { this.#env(160, 'triangle', 0.06, 0.05); }
  save(chain, zone) {
    const i = Math.min(chain - 1, this.scale.length - 1);
    const f = this.scale[Math.max(0, i)];
    this.#env(f, 'triangle', 0.28, 0.14);
    if (zone >= 2) this.#env(f * 1.5, 'sine', 0.22, 0.07, 0.02);
    if (zone === 3) this.#env(f * 2, 'sine', 0.3, 0.06, 0.04);
  }
  wave() { this.#env(523, 'sine', 0.4, 0.08); this.#env(659, 'sine', 0.5, 0.06, 0.12); }
  comboLost() { this.#env(196, 'sine', 0.15, 0.04); }
  over() {
    this.#env(72, 'sine', 0.9, 0.22);
    this.#env(55, 'sawtooth', 0.7, 0.08, 0.05);
  }
  record() { [440, 554, 659, 880].forEach((f, i) => this.#env(f, 'triangle', 0.3, 0.12, i * 0.09)); }
  shield() { this.#env(392, 'triangle', 0.25, 0.11); this.#env(587, 'triangle', 0.3, 0.1, 0.09); }
  shieldBreak() { this.#env(110, 'sawtooth', 0.35, 0.14); this.#env(70, 'sine', 0.5, 0.16, 0.02); }
  zone() { this.#env(330, 'sine', 0.5, 0.07); this.#env(494, 'sine', 0.6, 0.05, 0.15); }
  superOn() { [330, 415, 494, 659, 831].forEach((f, i) => this.#env(f, 'sawtooth', 0.35, 0.09, i * 0.06)); }
  heart() { this.#env(58, 'sine', 0.14, 0.16); this.#env(52, 'sine', 0.12, 0.12, 0.16); }
  superOff() { this.#env(494, 'sine', 0.3, 0.06); this.#env(330, 'sine', 0.4, 0.05, 0.12); }
  item() { this.#env(587, 'triangle', 0.15, 0.1); this.#env(880, 'triangle', 0.2, 0.08, 0.08); }
  cargoHit() { this.#env(140, 'square', 0.12, 0.1); this.#env(90, 'sine', 0.25, 0.12, 0.02); }
  setCharging(on) {
    if (!this.ctx || this.muted) { on = false; }
    if (on && !this.chargeOsc && this.ctx) {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(300, this.ctx.currentTime);
      o.frequency.linearRampToValueAtTime(720, this.ctx.currentTime + CONFIG.beam.dwell);
      g.gain.value = 0.045;
      o.connect(g).connect(this.ctx.destination);
      o.start();
      this.chargeOsc = { o, g };
    } else if (!on && this.chargeOsc) {
      try { this.chargeOsc.g.gain.setValueAtTime(0, this.ctx.currentTime); this.chargeOsc.o.stop(); }
      catch { /* ya parado */ }
      this.chargeOsc = null;
    }
  }
}

  const r = mulberry32(hashSeed('misiones-' + today()));
  const pool = [...MISSION_POOL];

  while (out.length < 3 && pool.length) {
    out.push(pool.splice(Math.floor(r() * pool.length), 1)[0]);
  }
  return out;
}

  volcano: { amp: 0.2, volcano: true },           // cono volcánico con rescoldo
};

/** Dibuja la costa de la región: dos capas (lejana brumosa + cercana) + decoración. */
function drawCoast(g, w, h, hor, theme) {
  const cp2 = COASTS[theme.coast];
  if (!cp2 || coastNoise.length === 0) return;
  const fogRGB = hexRGB(theme.skyBottom);
  const ridge = []; // perfil de la capa cercana para decorar después
  for (let layer = 0; layer < 2; layer++) {
    const amp = cp2.amp * h * (layer ? 1 : 0.6);
    g.fillStyle = layer
      ? rgb3(mix3(fogRGB, [0, 0, 0], 0.55))
      : rgb3(mix3(fogRGB, [30, 40, 55], 0.2), 0.85);
    g.beginPath();
    g.moveTo(-4, hor + 2);
    const peaks = [];
    let prevY = hor + 2;
    for (let i = 0; i <= 40; i++) {
      const xx = (i / 40) * w;
      let hh = coastNoise[(i + layer * 17) % coastNoise.length];
      if (cp2.sparse && hh < 0.62) hh = 0;
      if (cp2.gap && xx > w * 0.3 && xx < w * 0.72) hh *= 0.12; // bocana abierta
      if (cp2.volcano && layer) {
        // Cono volcánico dominante + faldas rugosas
        hh = Math.max(0, 1 - Math.abs(i - 20) / 9) * 0.9 + hh * 0.18;
      }
      if (cp2.buildings) hh = Math.round(hh * 5) / 5; // rascacielos escalonados
      const yy = hor + 2 - hh * amp;
      if (cp2.buildings) { g.lineTo(xx, prevY); g.lineTo(xx, yy); } // escalones
      else g.lineTo(xx, yy);
      prevY = yy;
      if (layer) {
        ridge.push({ x: xx, y: yy, hh });
        if (cp2.snow && hh > 0.66) peaks.push({ x: xx, y: yy });
      }
    }
    g.lineTo(w + 4, hor + 2);
    g.closePath();
    g.fill();
    if (peaks.length) {
      g.fillStyle = 'rgba(230,240,248,0.8)';
      for (const p of peaks) {
        g.beginPath();
        g.moveTo(p.x - 7, p.y + 9); g.lineTo(p.x, p.y); g.lineTo(p.x + 7, p.y + 9);
        g.closePath(); g.fill();
      }
    }
  }
  // Decoración de la capa cercana
  if (cp2.houses) {
    // Pueblo blanco griego: cubos encalados con ventanas cálidas
    for (let i = 4; i < ridge.length - 4; i += 3) {
      if (ridge[i].hh < 0.45) continue;
      g.fillStyle = 'rgba(232,238,244,0.85)';
      g.fillRect(ridge[i].x - 2, ridge[i].y - 4, 5, 4);
      if (i % 6 === 1) {
        g.fillStyle = 'rgba(255,196,107,0.9)';
        g.fillRect(ridge[i].x, ridge[i].y - 3, 1.4, 1.4);
      }
    }
  }
  if (cp2.lights) {
    // Ventanas cálidas desperdigadas por las colinas
    for (let i = 2; i < ridge.length - 2; i += 2) {
      if (coastNoise[(i * 3) % coastNoise.length] < 0.45) continue;
      const yy = ridge[i].y + (hor - ridge[i].y) * (0.25 + (i % 5) * 0.14);
      g.fillStyle = `rgba(255,196,107,${0.35 + 0.4 * (coastNoise[i % coastNoise.length])})`;
      g.fillRect(ridge[i].x + (i % 3), yy, 1.6, 1.6);
    }
  }
  if (cp2.palms) {
    // Palmeras a contraluz
    g.strokeStyle = 'rgba(6,14,20,0.95)';
    for (const i of [5, 12, 30, 36]) {
      const bx = ridge[i].x, by = hor + 2;
      g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(bx, by); g.quadraticCurveTo(bx + 3, by - 8, bx + 5, by - 13); g.stroke();
      g.lineWidth = 1.2;
      for (const da of [-0.9, -0.3, 0.4, 1.0]) {
        g.beginPath();
        g.moveTo(bx + 5, by - 13);
        g.quadraticCurveTo(bx + 5 + Math.cos(da) * 7, by - 15 + Math.sin(da) * 4, bx + 5 + Math.cos(da) * 11, by - 11 + Math.sin(da) * 7);
        g.stroke();
      }
    }
  }
  if (cp2.buildings) {
    // Luces de posición rojas en las azoteas más altas + ventanas
    for (let i = 2; i < ridge.length - 2; i += 2) {
      if (ridge[i].hh > 0.7 && (i % 4 === 0)) {
        g.fillStyle = `rgba(255,80,80,${0.5 + 0.4 * Math.sin(performance.now() / 700 + i)})`;
        g.fillRect(ridge[i].x - 1, ridge[i].y - 2, 2, 2);
      }
      if (ridge[i].hh > 0.3 && coastNoise[(i * 5) % coastNoise.length] > 0.5) {
        g.fillStyle = 'rgba(190,215,240,0.35)';
        g.fillRect(ridge[i].x, ridge[i].y + 4 + (i % 4) * 3, 1.4, 1.4);
      }
    }
  }
  if (cp2.volcano) {
    // Rescoldo en el cráter y columna tenue de ceniza
    const top = ridge.reduce((a, b) => (b.y < a.y ? b : a), ridge[0]);
    const vg3 = g.createRadialGradient(top.x, top.y, 1, top.x, top.y, 26);
    vg3.addColorStop(0, 'rgba(255,110,60,0.5)');
    vg3.addColorStop(1, 'rgba(255,110,60,0)');
    g.fillStyle = vg3;
    g.beginPath(); g.arc(top.x, top.y, 26, 0, TAU); g.fill();
    g.fillStyle = 'rgba(120,110,120,0.12)';
    g.beginPath();
    g.ellipse(top.x + 8, top.y - 16, 14, 7, 0.3, 0, TAU);
    g.fill();
  }
  // Bruma atlántica pegada al horizonte (Galicia y similares)
  if (theme.mist) {
    const mg2 = g.createLinearGradient(0, hor - 14, 0, hor + 26);
    mg2.addColorStop(0, 'rgba(190,205,220,0)');
    mg2.addColorStop(0.5, 'rgba(190,205,220,0.13)');
    mg2.addColorStop(1, 'rgba(190,205,220,0)');
    g.fillStyle = mg2;
    g.fillRect(0, hor - 14, w, 40);
  }
}

let circuits = [];
let coastNoise = [];
function makeStars(seed) {
  const r = mulberry32(seed ^ 0x5f3759df);
  stars = Array.from({ length: 90 }, () => ({ x: r(), y: r() * 0.6, s: 0.5 + r() * 1.3, tw: r() * TAU }));
  // Nubes dramáticas a la deriva (siluetas pictóricas cerca de la luna)
  clouds = Array.from({ length: 7 }, () => ({
    x: r(), y: 0.05 + r() * 0.42,
    rx: 46 + r() * 92, ry: 14 + r() * 26,
    o: 0.22 + r() * 0.30, sp: 0.35 + r() * 0.9, ph: r() * TAU,
  }));
  // Perfil de costa suave y determinista (suma de senos con fases aleatorias)
  const f1 = r() * TAU, f2 = r() * TAU, f3 = r() * TAU;
  coastNoise = Array.from({ length: 41 }, (_, i) =>
    Math.max(0, Math.min(1,
      0.45 + 0.3 * Math.sin(i * 0.55 + f1) + 0.2 * Math.sin(i * 1.3 + f2) + 0.12 * Math.sin(i * 2.9 + f3))));
  // Pistas de circuito de la "placa base" del universo ciber (deterministas)
  circuits = Array.from({ length: 14 }, () => ({
    a: r() * TAU,                 // ángulo de partida
    r0: 0.2 + r() * 0.25,         // radio inicial
    r1: 0.55 + r() * 0.38,        // radio del codo
    da: (r() - 0.5) * 1.2,        // giro del tramo angular
    node: r() > 0.35,             // ¿lleva nodo al final?
  }));
}
makeStars(game.seed);

function resetVisuals() {
  particles = []; popups = []; savedShips = [];
  shake = 0; flash = 0; culpritGhost = null; waveMsg = null; zoneBanner = null;
  celebrated = false; prevBest = records.best; overSince = -1;
  nearShown = false; shareRect = null;
  slowmo = 0; bigBanner = null; travelCard = null; rings.length = 0; invHits.length = 0; sinkers.length = 0;
  runStats.close = 0; runStats.supers = 0; runStats.cargos = 0;
  runStats.itemTypes = new Set(); runStats.milestone = 0;
  makeStars(game.seed);
}

function restart() {
  game = makeGame();
  resetVisuals();
  session.games++;
  if (session.restartAt) {
    const lat = (performance.now() - session.restartAt) / 1000;
    session.restartLatencies.push(lat);
    if (DEBUG) console.debug(`[FARO] reinicio en ${lat.toFixed(2)} s`);
  }
  game.down(); // la misma pulsación que reinicia ya arranca la partida
}

// ---------- Entrada ----------
let pressed = false;

function layout() {
  const w = innerWidth, h = innerHeight;
  return { w, h, cx: w / 2, cy: h / 2 + Math.min(w, h) * 0.02, R: Math.min(w, h) * 0.42 };
}

// Zonas seguras del iPhone (notch / Dynamic Island / barra de inicio):
// se miden con la sonda CSS env(safe-area-inset-*) y desplazan el HUD.
const SAFE = { top: 0, bottom: 0 };
function measureSafeArea() {
  try {
    const probe = document.getElementById('safe');
    if (probe) {
      const cs = getComputedStyle(probe);
      SAFE.top = Math.min(60, parseFloat(cs.paddingTop) || 0);
      SAFE.bottom = Math.min(40, parseFloat(cs.paddingBottom) || 0);
    }
    // Anulación para pruebas de maquetación: ?safetop=59&safebottom=34
    if (params.has('safetop')) SAFE.top = Number(params.get('safetop')) || 0;
    if (params.has('safebottom')) SAFE.bottom = Number(params.get('safebottom')) || 0;
  } catch { /* sin sonda seguimos a 0 */ }
}

function muteRect() {
  const { w } = layout();
  return { x: w - 54, y: 10 + SAFE.top, s: 40 };
}
/** Botón de efectos reducidos (accesibilidad): menos sacudidas y partículas. */
function fxRect() {
  const { w } = layout();
  return { x: w - 54, y: 56 + SAFE.top, s: 40 };
}

let lastDownAt = 0;

/** Zonas táctiles de los selectores del menú (se rellenan al dibujar). */
const menuHits = [];

function onDown(e) {
  sound.ensure();
  debugState.inputAt = performance.now();
  // Un toque durante la intro la salta (y desbloquea el audio)
  if (intro.active) {
    intro.active = false;
    sound.press();
    return;
  }
  if (e && e.clientX != null) {
    const m = muteRect();
    if (e.clientX >= m.x && e.clientX <= m.x + m.s && e.clientY >= m.y && e.clientY <= m.y + m.s) {
      sound.toggleMute();
      return;
    }
    const fx = fxRect();
    if (e.clientX >= fx.x && e.clientX <= fx.x + fx.s && e.clientY >= fx.y && e.clientY <= fx.y + fx.s) {
      prefs.lowFx = !prefs.lowFx;
      store.set('faro.lowFx', prefs.lowFx);
      sound.press();
      return;
    }
    // Selectores del menú (solo en pantalla de inicio)
    if (game.state === 'ready') {
      for (const h of menuHits) {
        if (e.clientX >= h.x && e.clientX <= h.x + h.w && e.clientY >= h.y && e.clientY <= h.y + h.h) {
          h.fn();
          sound.press();
          return;
        }
      }
      // Con la tienda abierta, un toque fuera no empieza la partida
      if (shopOpen) return;
    }
    // Botones del inventario durante la partida (no detienen el haz)
    if (game.state === 'playing') {
      for (const hh of invHits) {
        if (e.clientX >= hh.x && e.clientX <= hh.x + hh.w && e.clientY >= hh.y && e.clientY <= hh.y + hh.h) {
          hh.fn();
          return;
        }
      }
    }
    // Botón de retar en la pantalla de derrota
    if (game.state === 'over' && shareRect &&
      e.clientX >= shareRect.x && e.clientX <= shareRect.x + shareRect.w &&
      e.clientY >= shareRect.y && e.clientY <= shareRect.y + shareRect.h) {
      doShare();
      return;
    }
    // DUELO: el almirante toca FUERA del mar para lanzar un barco desde ese
    // ángulo (segundo dedo: no interfiere con el haz del farero)
    if (game.state === 'playing' && game.duel) {
      const L = layout();
      // Trazado de rayo inverso: del píxel tocado al plano del mar
      const hit = unprojectSea(e.clientX, e.clientY, L);
      if (hit && hit.d > 1.02 && hit.d < 3.5) {
        game.duelSpawn(hit.a);
        return;
      }
    }
  }
  if (pressed) return;
  pressed = true;
  beamPointer = e && e.pointerId != null ? e.pointerId : 'kb';
  // Doble toque durante la partida → SUPERFARO
  const now = performance.now();
  if (game.state === 'playing' && now - lastDownAt < 320) {
    if (game.activateSuper()) { lastDownAt = 0; game.down(); return; }
  }
  lastDownAt = now;
  if (game.state === 'playing') sound.press();
  game.down();
}
/** Dedo/tecla que sujeta el haz (para que el dedo del almirante no lo suelte). */
let beamPointer = null;
function onUp(e) {
  if (!pressed) return;
  if (e && e.pointerId != null && e.pointerId !== beamPointer) return;
  pressed = false;
  beamPointer = null;
  game.up();
}

addEventListener('pointerdown', onDown);
addEventListener('pointerup', onUp);
addEventListener('pointercancel', onUp);
addEventListener('blur', onUp);
addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); onDown(null); }
  else if (e.key === 'm' || e.key === 'M') sound.toggleMute();
  else if (DEBUG && e.key === '[') debugState.timescale = Math.max(0.1, debugState.timescale - 0.15);
  else if (DEBUG && e.key === ']') debugState.timescale = Math.min(3, debugState.timescale + 0.15);
  else if (DEBUG && (e.key === 'i' || e.key === 'I')) debugState.invincible = !debugState.invincible;
  else if (DEBUG && (e.key === 'h' || e.key === 'H')) debugState.hitboxes = !debugState.hitboxes;
});
addEventListener('keyup', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') onUp();
});

// ---------- Eventos del núcleo → efectos ----------
/** Rectángulo redondeado compatible (ctx.roundRect no existe en todos los visores). */
function roundedRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/** Vibración háptica opcional; algunos visores embebidos la bloquean lanzando. */
function vibrate(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch { /* opcional */ }
}

// ---------- Motor WebGL: agua y cielo con iluminación por píxel ----------
// Shader propio (sin librerías): reconstruye EXACTAMENTE la cámara del juego
// en la GPU, así el agua iluminada coincide con la geometría de la jugabilidad.
// Si WebGL falla (visores, equipos antiguos), el juego usa el mar 2D de siempre.
const GL = (() => {
  try {
    const cv = document.createElement('canvas');
    cv.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none;';
    const gameCv = document.getElementById('game');
    gameCv.style.position = 'relative';
    gameCv.style.zIndex = '1';
    document.body.insertBefore(cv, gameCv);
    const gl = cv.getContext('webgl', { antialias: false, alpha: false, depth: false, powerPreference: 'high-performance' });
    if (!gl) { cv.remove(); return null; }

    const VS = 'attribute vec2 aP;void main(){gl_Position=vec4(aP,0.,1.);}';
    const FS = `precision highp float;
uniform vec2 uRes;
uniform float uTime,uCamY,uCamZ,uCp,uSp,uF,uAx,uAy,uHor;
uniform vec3 uSkyTop,uSkyHor,uSea,uSeaLit,uMoonCol,uBeamCol;
uniform vec2 uMoon;
uniform float uMoonR,uBeamA,uBeamHalf,uBeamGlow,uDanger,uOct,uStarSeed;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

float vnoise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  float a=hash(i),b=hash(i+vec2(1.,0.)),c=hash(i+vec2(0.,1.)),d=hash(i+vec2(1.,1.));
  vec2 u=f*f*(3.-2.*f);
  return mix(a,b,u.x)+(c-a)*u.y*(1.-u.x)+(d-b)*u.x*u.y;
}
float fbm(vec2 p,float oct){
  float v=0.,a=0.5;
  for(int i=0;i<4;i++){
    if(float(i)>=oct) break;
    v+=a*vnoise(p); p*=2.05; a*=0.5;
  }
  return v;
}

float wH(vec2 p,float t){
  float h=sin(p.x*1.1+p.y*1.4+t*0.55)*0.035
        +sin(p.x*0.5-t*0.35+p.y)*0.025;
  if(uOct>2.5){
    h+=sin(p.x*2.3-p.y*1.7+t*0.9)*0.012
      +sin((p.x+p.y)*3.7+t*1.4)*0.007;
  }
  return h;
}

void main(){
  float x=gl_FragCoord.x;
  float yTop=uRes.y-gl_FragCoord.y;
  float kk=(uAy-yTop)/uF;
  float denom=kk*uCp+uSp;
  float dz=uCamY*(kk*uSp-uCp)/denom;
  float z1=-uCamY*uSp+dz*uCp;
  vec3 col;
  bool isSky=(abs(denom)<1e-5||z1<=0.05);
  float tt=0.0;
  if(isSky){
    // CIELO: gradiente + estrellas titilantes
    tt=clamp(yTop/max(uHor,1.0),0.,1.);
    col=mix(uSkyTop,uSkyHor,tt);
    vec2 cell=floor(gl_FragCoord.xy/3.0);
    float st=hash(cell+uStarSeed);
    if(st>0.997&&tt<0.92){
      float tw=0.5+0.5*sin(uTime*2.0+st*40.0);
      col+=vec3(0.85,0.9,0.95)*tw*0.8*smoothstep(0.997,1.0,st)*8.0*(1.0-tt);
    }
    col=mix(col,vec3(0.36,0.07,0.12),uDanger*(1.0-tt)*0.75);
  }else{
    // AGUA: intersección exacta con el plano del mar de la jugabilidad
    float wx=(x-uAx)*z1/uF;
    float wz=dz+uCamZ;
    vec2 P=vec2(wx,wz);
    float e=0.05;
    float h0=wH(P,uTime);
    float nx=(wH(P+vec2(e,0.),uTime)-h0)/e;
    float nz=(wH(P+vec2(0.,e),uTime)-h0)/e;
    vec3 N=normalize(vec3(-nx,1.0,-nz));
    vec3 Wp=vec3(wx,h0,wz);
    vec3 camP=vec3(0.,uCamY,uCamZ);
    vec3 V=normalize(camP-Wp);
    // Luz lunar direccional (arriba-derecha, hacia la cámara)
    vec3 L=normalize(vec3(0.55,0.75,-0.35));
    float dif=max(dot(N,L),0.);
    vec3 Hh=normalize(L+V);
    float spec=pow(max(dot(N,Hh),0.),120.0);
    col=mix(uSea,uSeaLit,dif*0.34)+uMoonCol*spec*0.7;
    // Camino de luz de luna sobre el agua: un halo angosto alrededor del
    // mismo reflejo especular (sendero centelleante contenido, no un lavado
    // general que aclare todo el mar)
    float spec2=pow(max(dot(N,Hh),0.),34.0);
    col+=uMoonCol*spec2*0.22;
    // Crestas de espuma: ruido que aparece justo donde la ola es más alta
    if(uOct>2.5){
      float foamN=vnoise(P*3.0+vec2(0.0,uTime*0.5));
      float foam=smoothstep(0.55,0.82,foamN)*smoothstep(0.014,0.034,h0);
      col=mix(col,vec3(0.86,0.95,0.98),foam*0.55);
    }
    // HAZ DEL FARO: mismo ángulo y anchura que la jugabilidad
    float ang=atan(wz,wx);
    float ad=abs(atan(sin(ang-uBeamA),cos(ang-uBeamA)));
    float d2=length(P);
    if(ad<uBeamHalf*1.15&&d2<1.12){
      float k2=(1.0-smoothstep(uBeamHalf*0.7,uBeamHalf*1.15,ad))*(1.0-d2*0.82)*uBeamGlow;
      col+=uBeamCol*k2*(0.55+0.45*dif);
      // La cresta dentro del haz brilla más (luz rasante)
      col+=uBeamCol*spec*k2*2.0;
    }
    // Niebla por distancia hacia el color del horizonte
    float fog=1.0-exp(-max(wz+1.7,0.)*0.34);
    col=mix(col,uSkyHor,clamp(fog,0.,0.92));
    // Reflejo rojizo del cielo en peligro + oscurecer muy cerca de cámara
    col=mix(col,col*vec3(1.35,0.62,0.62),uDanger*0.28);
    col*=1.0-0.25*exp(-max(wz+2.3,0.)*2.0);
  }
  // LUNA Y NUBES: se pintan SIEMPRE por encima (cielo o mar), sin importar
  // dónde caiga exactamente la línea del horizonte en esta pantalla. Así una
  // luna grande y baja, casi rozando el mar, nunca queda cortada por la
  // repintada opaca del agua (el fallo que teníamos antes); igual que en una
  // fotografía real, su resplandor se derrama sobre el mar aunque su centro
  // esté técnicamente "detrás" del horizonte.
  // (los divisores del exp() controlan cuán rápido cae el brillo: números
  // pequeños = halo ceñido, grandes = halo amplio; deben quedarse MODESTOS
  // o el resplandor inunda todo el cielo y lo deja gris y plano)
  float md=distance(vec2(x,yTop),uMoon);
  col+=uMoonCol*0.62*exp(-md*md/(uMoonR*uMoonR*2.2));
  col+=uMoonCol*0.22*exp(-md*md/(uMoonR*uMoonR*8.5));
  if(md<uMoonR){
    vec2 mp=(vec2(x,yTop)-uMoon)/uMoonR;
    float craters=fbm(mp*3.4+17.0,3.0)*0.5+fbm(mp*8.0+41.0,2.0)*0.22;
    float limb=smoothstep(uMoonR*0.52,uMoonR,md); // sombreado hacia el borde
    col=uMoonCol*(1.1-craters*0.13-limb*0.16);
  }
  // NUBES voluminosas: dos capas de fbm (masas grandes + detalle) a la

  bool nearMoon=md<uMoonR*4.0;
  if(isSky||nearMoon){
    float cloudT=uTime*0.012;
    vec2 cpBig=vec2(x*0.9,yTop)*0.0016+vec2(cloudT*0.7,cloudT*0.1);
    vec2 cpDet=vec2(x*0.9,yTop)*0.004+vec2(cloudT*1.4,cloudT*0.22);
    float cloudBig=fbm(cpBig,3.0);
    float cloudDet=fbm(cpDet,uOct>2.5?4.0:2.0);
    float cloudN=cloudBig*0.7+cloudDet*0.4;
    float cloud=smoothstep(0.46,0.78,cloudN)*(isSky?1.0:0.3);
    float back=exp(-md*md/(uMoonR*uMoonR*3.4));
    vec3 cloudDark=mix(uSkyHor,vec3(0.025,0.035,0.06),0.7);

    const mk = (type, src) => {

    gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const aP = gl.getAttribLocation(prog, 'aP');
    gl.enableVertexAttribArray(aP);
    gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
    const U = {};
    for (const n of ['uRes', 'uTime', 'uCamY', 'uCamZ', 'uCp', 'uSp', 'uF', 'uAx', 'uAy', 'uHor',
      'uSkyTop', 'uSkyHor', 'uSea', 'uSeaLit', 'uMoonCol', 'uBeamCol', 'uMoon', 'uMoonR',
      'uBeamA', 'uBeamHalf', 'uBeamGlow', 'uDanger', 'uOct', 'uStarSeed']) {
      U[n] = gl.getUniformLocation(prog, n);
    }
    const c3 = (loc, hex) => { const c = hexRGB(hex); gl.uniform3f(loc, c[0] / 255, c[1] / 255, c[2] / 255); };
    let scale = 1;
    const api = {
      cv, on: false,
      resize() {
        scale = Math.min(prefs.lowFx ? 1 : 1.5, window.devicePixelRatio || 1);
        cv.width = Math.max(2, Math.round(innerWidth * scale));
        cv.height = Math.max(2, Math.round(innerHeight * scale));

      render(cam, theme, p) {
        try {
          gl.uniform2f(U.uRes, cv.width, cv.height);

          gl.uniform1f(U.uCamY, cam.y);
          gl.uniform1f(U.uCamZ, cam.z);
          gl.uniform1f(U.uCp, cam.cp);
          gl.uniform1f(U.uSp, cam.sp);
          gl.uniform1f(U.uF, cam.f * scale);
          gl.uniform1f(U.uAx, cam.ax * scale);
          gl.uniform1f(U.uAy, cam.ay * scale);
          gl.uniform1f(U.uHor, Math.max(1, cam.horizon) * scale);

          c3(U.uSkyHor, theme.skyBottom);
          c3(U.uSea, theme.sea);

          gl.uniform3f(U.uMoonCol, p.moonCol[0], p.moonCol[1], p.moonCol[2]);
          gl.uniform2f(U.uMoon, p.moonX * scale, p.moonY * scale);

          gl.uniform1f(U.uBeamGlow, p.beamGlow);
          gl.uniform1f(U.uDanger, p.danger);

          gl.uniform1f(U.uStarSeed, p.starSeed);

// ---------- Cámara del juego: PERSPECTIVA REAL (lo lejano, pequeño) ----------
// La cámara está detrás y por encima del borde cercano del mar, inclinada
// hacia el faro. Todo el campo de juego se proyecta con perspectiva de verdad:
// los barcos lejanos se ven pequeños y crecen al acercarse.
let GC = null; // cámara del frame actual (se recalcula en draw)

function gameCamera(L) {
  const cam = {
    y: 1.35,            // altura sobre el mar (unidades de radio de juego)
    z: -2.5,            // detrás del borde cercano
    pitch: -0.44,       // inclinación suave (menos mareo, más horizonte)
    f: L.R * 2.5,       // focal
    ax: L.cx,
    ay: L.cy + L.R * 0.06,
  };
  cam.cp = Math.cos(cam.pitch);
  cam.sp = Math.sin(cam.pitch);
  // Píxeles por unidad de mundo en el centro del campo (para escalar sprites)
  const zc = -cam.y * cam.sp + (0 - cam.z) * cam.cp;
  cam.sMid = cam.f / zc;
  // Línea del horizonte en pantalla (donde el mar se junta con el cielo)
  cam.horizon = cam.ay - cam.f * Math.tan(-cam.pitch);
  return cam;
}

/** Proyección cartesiana de un punto del mundo (wx, wz, altura). */
function seaXYW(wx, wz, hgt, L) {
  const cam = GC || (GC = gameCamera(L));
  const dy = hgt - cam.y;
  const dz = wz - cam.z;
  const y1 = dy * cam.cp - dz * cam.sp;
  const z1 = dy * cam.sp + dz * cam.cp;
  const s = cam.f / Math.max(0.3, z1);
  return { x: cam.ax + wx * s, y: cam.ay - y1 * s, s };
}

/** Proyecta un punto del mar (ángulo, dist, altura) a pantalla. */
function seaXY(a, d, hgt, L) {
  const cam = GC || (GC = gameCamera(L));
  const wx = Math.cos(a) * d;
  const wz = Math.sin(a) * d; // +z = lejos (parte alta de la pantalla)
  const dy = hgt - cam.y;
  const dz = wz - cam.z;
  const y1 = dy * cam.cp - dz * cam.sp;
  const z1 = dy * cam.sp + dz * cam.cp;
  const s = cam.f / Math.max(0.35, z1);
  return { x: cam.ax + wx * s, y: cam.ay - y1 * s, s, k: s / cam.sMid };
}

function shipXY(s, L) {
  return seaXY(s.angle, s.dist, 0, L);
}

/** Traza un anillo del mar proyectado (para zonas, ancla, banda del duelo). */
function seaRing(g, d, L, steps = 56) {
  g.beginPath();
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const p = seaXY(a, d, 0, L);
    if (i === 0) g.moveTo(p.x, p.y); else g.lineTo(p.x, p.y);
  }
}

/** Pantalla → punto del plano del mar (rayo inverso; para el toque del duelo). */
function unprojectSea(px, py, L) {
  const cam = GC || (GC = gameCamera(L));
  const kk = (cam.ay - py) / cam.f;
  const denom = kk * cam.cp + cam.sp;
  if (Math.abs(denom) < 1e-6) return null;
  const dz = cam.y * (kk * cam.sp - cam.cp) / denom;
  const z1 = -cam.y * cam.sp + dz * cam.cp;
  if (z1 <= 0.05) return null;
  const wx = ((px - cam.ax) * z1) / cam.f;
  const wz = dz + cam.z;
  return { a: Math.atan2(wz, wx), d: Math.hypot(wx, wz) };
}

/** '#rrggbb' → [r,g,b] para poder sombrear los colores del aspecto. */
function hexRGB(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function burst(x, y, color, n, speed = 90) {
  if (prefs.lowFx) n = Math.ceil(n / 3); // accesibilidad: menos partículas
  for (let i = 0; i < n && particles.length < 350; i++) {
    const a = Math.random() * TAU, v = speed * (0.3 + Math.random());
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5 + Math.random() * 0.5, t: 0, color, size: 1.5 + Math.random() * 2.5 });
  }
}

      console.debug('[FARO] derrota', ev.cause);
      if (!game.duel) {
        records.best = Math.max(records.best, game.score);
        records.bestChain = Math.max(records.bestChain, game.bestChain);
        records.daily.score = Math.max(records.daily.score, game.score);
        store.set('faro.best', records.best);
        store.set('faro.bestChain', records.bestChain);
        store.set('faro.daily', records.daily);
        // Récord por costa del mundo (la región donde terminó la noche)
        if (!dailyMode && !challenge) {
          const rz = String(game.zoneIndex % THEMES.length);
          const prevR = prefs.regionBest[rz] || 0;
          if (game.score > prevR) {
            prefs.regionBest[rz] = game.score;
            store.set('faro.regionBest', prefs.regionBest);
            if (prevR > 0) {
              popups.push({ x: L.cx, y: L.cy - L.R * 0.9, text: '🏝️ ¡RÉCORD DE ESTA COSTA!', sub: THEMES[game.zoneIndex % THEMES.length].name, t: 0, color: PAL.foam, big: true });
            }
          }
        }
      }
      // Progresión: experiencia, monedas, racha de días y escenarios desbloqueados
      touchStreak();
      lastShareScore = game.score;
      const earned = Math.floor(game.score / 50) + game.bonusCoins;
      if (earned > 0) {
        prefs.coins += earned;
        store.set('faro.coins', prefs.coins);
      }
      const lvl0 = levelFor(prefs.xp);
      prefs.xp += game.score;
      store.set('faro.xp', prefs.xp);
      if (levelFor(prefs.xp) > lvl0) {
        popups.push({ x: L.cx, y: L.cy - L.R * 0.75, text: `¡FARERO NIVEL ${levelFor(prefs.xp)}!`, sub: 'nuevos aspectos en el menú', t: 0, color: PAL.beamCore, big: true });
        sound.record();
      }
      const reached = Math.min(game.zoneIndex, THEMES.length - 1);
      if (reached > prefs.zoneUnlocked) {
        prefs.zoneUnlocked = reached;
        store.set('faro.zoneUnlocked', prefs.zoneUnlocked);
        popups.push({ x: L.cx, y: L.cy - L.R * 0.6, text: '¡ESCENARIO DESBLOQUEADO!', sub: themeName(reached), t: 0, color: PAL.foam, big: true });
      }
    } else if (ev.type === 'restart') {
      restart();
    }
  }
  game.events.length = 0;
}

// ---------- Intro cinemática: motor 3D por software (sin dependencias) ----------
// Rehecha tras el feedback de los testers ("muy de niño pequeño"): malla de
// océano en perspectiva real con oleaje, niebla por profundidad y especular
// lunar; faro cilíndrico sombreado por caras; barcos con casco 3D y luz de
// borde; haz volumétrico con destello de lente; tormenta con relámpagos;
// grano de película, viñeta y barras de cine.

/** Proyección perspectiva de un punto del mundo a pantalla. */
function proj3(x, y, z, cam, w, h) {
  const dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const y1 = dy * cp - dz * sp;
  const z1 = dy * sp + dz * cp;
  if (z1 < 0.25) return null;
  const s = cam.f / z1;
  return { x: w / 2 + dx * s, y: h / 2 - y1 * s, z: z1, s };
}

/** Altura del oleaje (suma de senos; arrecia con la tormenta). */
function seaH(x, z, t, rough) {
  return (Math.sin(x * 0.32 + t * 1.1) * 0.55 +
    Math.sin(z * 0.45 - t * 1.7) * 0.75 +
    Math.sin((x + z) * 0.18 + t * 0.7) * 0.45 +
    Math.sin(x * 0.9 - t * 2.3) * 0.18) * rough;
}

const mix3 = (a, b, k) => [
  a[0] + (b[0] - a[0]) * k,
  a[1] + (b[1] - a[1]) * k,
  a[2] + (b[2] - a[2]) * k,
];
const rgb3 = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

let grainCanvas = null;
function grain() {
  if (!grainCanvas) {
    grainCanvas = document.createElement('canvas');
    grainCanvas.width = grainCanvas.height = 160;
    const gg = grainCanvas.getContext('2d');
    const img = gg.createImageData(160, 160);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() * 255;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 26;
    }
    gg.putImageData(img, 0, 0);
  }
  return grainCanvas;
}

function drawIntro(L, dt) {
  const { w, h } = L;
  const g = ctx2d;
  intro.t += dt;
  const t = intro.t;
  if (t > 11.4) { intro.active = false; return; }

  const storm = t >= 7.3;
  const heat = storm ? Math.min(1, (t - 7.3) / 1.3) : 0;
  const rough = 1 + heat * 1.6 + easeOut(t / 3) * 0.2;

  // Cámara: desciende del cielo al nivel del mar y encuadra el faro
  const cam = {
    x: 0,
    y: 7.5 - 5.2 * easeOut(t / 3.2) + Math.sin(t * 0.7) * 0.15,
    z: 0,
    pitch: -0.34 + 0.3 * easeOut(t / 3.2),
    f: Math.min(w, h) * 0.98,
  };
  if (storm) { cam.x += (Math.random() - 0.5) * 0.12; cam.y += (Math.random() - 0.5) * 0.12; }

  // Paleta según acto
  const skyTop = mix3([4, 9, 20], [56, 12, 22], heat);
  const skyHor = mix3([16, 34, 58], [96, 26, 38], heat);
  const seaDark = mix3([7, 17, 31], [26, 9, 18], heat);
  const seaLit = mix3([64, 104, 142], [168, 64, 74], heat);

  // Cielo
  const horizon = proj3(0, 0.4, 60, cam, w, h);
  const hy = horizon ? Math.min(h * 0.7, Math.max(h * 0.18, horizon.y)) : h * 0.4;
  const sky = g.createLinearGradient(0, 0, 0, hy);
  sky.addColorStop(0, rgb3(skyTop));
  sky.addColorStop(1, rgb3(skyHor));
  g.fillStyle = sky;
  g.fillRect(0, 0, w, hy + 2);
  g.fillStyle = rgb3(seaDark);
  g.fillRect(0, hy, w, h - hy);

  // Estrellas y luna con halo
  for (let i = 0; i < 60; i++) {
    const s = stars[i];
    const sy2 = s.y * hy * 1.4;
    if (sy2 > hy - 6) continue;
    g.globalAlpha = (0.25 + 0.3 * Math.sin(t * 2 + s.tw)) * (1 - heat * 0.8);
    g.fillStyle = '#eaf2fa';
    g.fillRect(s.x * w, sy2, s.s, s.s);
  }
  g.globalAlpha = 1;
  const mx = w * 0.74, my = hy * 0.34;
  const moonC = storm ? [242, 176, 160] : [223, 233, 242];
  const halo = g.createRadialGradient(mx, my, 4, mx, my, 90);
  halo.addColorStop(0, rgb3(moonC, 0.5));
  halo.addColorStop(1, rgb3(moonC, 0));
  g.fillStyle = halo;
  g.beginPath(); g.arc(mx, my, 90, 0, TAU); g.fill();
  g.fillStyle = rgb3(moonC);
  g.beginPath(); g.arc(mx, my, 20, 0, TAU); g.fill();
  g.fillStyle = rgb3(mix3(moonC, [120, 130, 150], 0.4), 0.5);
  g.beginPath(); g.arc(mx - 6, my - 5, 4.5, 0, TAU); g.fill();
  g.beginPath(); g.arc(mx + 7, my + 4, 3, 0, TAU); g.fill();

  // OCÉANO: malla proyectada con sombreado por pendiente, especular y niebla
  const NX = 30, NZ = 19;
  const X0 = -34, X1 = 34, Z0 = 2.2, Z1 = 55;
  const pts = [];
  for (let j = 0; j <= NZ; j++) {
    const zf = Z0 * Math.pow(Z1 / Z0, j / NZ); // filas logarítmicas: detalle cerca
    const row = [];
    for (let i = 0; i <= NX; i++) {
      const xf = X0 + (X1 - X0) * (i / NX);
      row.push({ x: xf, z: zf, y: seaH(xf, zf, t, rough), p: proj3(xf, seaH(xf, zf, t, rough), zf, cam, w, h) });
    }
    pts.push(row);
  }
  for (let j = NZ - 1; j >= 0; j--) {
    for (let i = 0; i < NX; i++) {
      const a = pts[j + 1][i], b = pts[j + 1][i + 1], c = pts[j][i + 1], d = pts[j][i];
      if (!a.p || !b.p || !c.p || !d.p) continue;
      const slope = (d.y + c.y - a.y - b.y) * 0.5; // cara hacia la cámara = iluminada
      let k = Math.max(0, Math.min(1, 0.42 + slope * 0.55));
      // Especular lunar: banda vertical bajo la luna
      const midX = (a.x + b.x) / 2;
      const moonBand = Math.max(0, 1 - Math.abs(midX - 16) / 5.5);
      k = Math.min(1, k + moonBand * Math.max(0, slope) * 0.9);
      const fog = Math.min(1, (a.z / Z1) * 1.05);
      const col = mix3(mix3(seaDark, seaLit, k), skyHor, fog * fog);
      g.fillStyle = rgb3(col);
      g.beginPath();
      g.moveTo(a.p.x, a.p.y); g.lineTo(b.p.x, b.p.y);
      g.lineTo(c.p.x, c.p.y); g.lineTo(d.p.x, d.p.y);
      g.closePath(); g.fill();
    }
  }

  // BARCOS 3D (acto 2): cascos oscuros con luz de borde, cabecean con la ola
  if (t >= 2.3 && t < 7.6) {
    const fleet = [
      { x0: -9, delay: 2.3 }, { x0: 8, delay: 2.8 }, { x0: -1.5, delay: 3.3 },
    ];
    for (const f of fleet) {
      const k = (t - f.delay) / 3.4;
      if (k <= 0 || k >= 1) continue;
      const z = 46 - 40 * easeIn(k);
      const x = f.x0 * (0.4 + 0.6 * (z / 46));
      const y = seaH(x, z, t, rough) + 0.4;
      const roll = Math.sin(t * 1.8 + f.x0) * 0.12;
      // Vértices del casco (mundo, popa hacia la cámara)
      const V = [
        [x, y + 0.5, z - 2.6],           // proa (lejos)
        [x - 1.5 + roll, y + 1.3, z],    // babor
        [x, y + 1.05, z + 2.4],          // popa (cerca)
        [x + 1.5 + roll, y + 1.3, z],    // estribor
        [x + roll * 2, y + 4.6, z - 0.3],// tope del mástil
      ].map((v) => proj3(v[0], v[1], v[2], cam, w, h));
      if (V.some((p) => !p)) continue;
      const fog = Math.min(1, z / Z1 + 0.12);
      g.fillStyle = rgb3(mix3([8, 15, 26], skyHor, fog * fog));
      g.beginPath();
      g.moveTo(V[0].x, V[0].y); g.lineTo(V[1].x, V[1].y);
      g.lineTo(V[2].x, V[2].y); g.lineTo(V[3].x, V[3].y);
      g.closePath(); g.fill();
      // Vela
      g.fillStyle = rgb3(mix3([16, 26, 40], skyHor, fog * fog));
      g.beginPath();
      g.moveTo(V[4].x, V[4].y); g.lineTo(V[1].x, V[1].y); g.lineTo(V[2].x, V[2].y);
      g.closePath(); g.fill();
      // Luz de borde rojiza (amenaza) + espuma en proa
      g.strokeStyle = `rgba(255,96,84,${0.25 + 0.55 * (1 - z / 46)})`;
      g.lineWidth = 1.4;
      g.beginPath();
      g.moveTo(V[0].x, V[0].y); g.lineTo(V[1].x, V[1].y); g.lineTo(V[2].x, V[2].y);
      g.stroke();
      g.fillStyle = 'rgba(210,230,245,0.5)';
      for (let sp2 = 0; sp2 < 3; sp2++) {
        g.fillRect(V[2].x - 6 + Math.random() * 12, V[2].y + 2 + Math.random() * 4, 1.6, 1.6);
      }
    }
  }

  // FARO 3D (acto 3): cilindro por segmentos con sombreado y haz volumétrico
  if (t >= 4.8) {
    const rise = easeOut((t - 4.8) / 1.3);
    const FX = 0, FZ = 26;
    const HT = 13 * rise;
    const SEG = 14, BANDS = 5;
    const baseY = seaH(FX, FZ, t, rough) - 0.4;
    for (let bnd = 0; bnd < BANDS; bnd++) {
      const y0 = baseY + (HT * bnd) / BANDS;
      const y1 = baseY + (HT * (bnd + 1)) / BANDS;
      const r0 = 2.5 - 1.1 * (bnd / BANDS);
      const r1 = 2.5 - 1.1 * ((bnd + 1) / BANDS);
      const white = bnd % 2 === 0;
      for (let sgm = 0; sgm < SEG; sgm++) {
        const a0 = (sgm / SEG) * TAU, a1 = ((sgm + 1) / SEG) * TAU;
        const nz = Math.cos((a0 + a1) / 2);
        if (nz > 0.05) continue; // caras traseras
        const P = [
          proj3(FX + Math.sin(a0) * r0, y0, FZ + Math.cos(a0) * r0, cam, w, h),
